<script>
/* ============================================================
   VAParse — interpreta planejamentos colados (texto, JSON, tabela)
   e calcula a mesclagem com um planejamento existente.
   Funções puras: sem acesso a banco nem a DOM.
   Regra de ouro: nunca inventar. Campo ausente = string vazia.
   ============================================================ */
(function (root) {
  "use strict";

  const MONTHS = ["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const MONTHS_SHORT = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  const norm = (s) => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const titleKey = (s) => norm(s).replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();

  const FIELD_ALIASES = {
    id: ["id", "codigo do conteudo"],
    date: ["data", "dia", "date", "data de publicacao", "publicacao", "data prevista", "quando"],
    type: ["tipo", "formato", "type", "format", "tipo de conteudo"],
    title: ["titulo", "title", "tema", "pauta", "nome", "assunto"],
    objective: ["objetivo", "objective", "meta", "funil", "objetivo estrategico"],
    description: ["descricao", "description", "descricao estrategica", "estrategia", "briefing", "roteiro", "ideia", "conceito"],
    caption: ["legenda", "caption", "copy", "texto da legenda", "texto"],
    image: ["imagem", "imagens", "image", "images", "arte", "artes", "foto", "fotos", "midia", "referencia", "referencia visual", "arquivo"],
    status: ["status", "situacao", "etapa"],
  };
  const ALIAS_TO_FIELD = {};
  Object.entries(FIELD_ALIASES).forEach(([f, arr]) => arr.forEach((a) => (ALIAS_TO_FIELD[a] = f)));
  const fieldOf = (label) => ALIAS_TO_FIELD[norm(label).replace(/[:*]/g, "").trim()] || null;

  /* ---------------- normalizadores ---------------- */
  function normalizeType(v) {
    const n = norm(v);
    if (!n) return "";
    if (/^reels?\b|video|^vídeo/.test(n)) return "Reel";
    if (/carross|carousel|carrocel|carosel/.test(n)) return "Carrossel";
    if (/^stor(y|ies)|^storie/.test(n)) return "Story";
    if (/^post|estatic|^feed|^imagem unica|^foto/.test(n)) return "Post";
    return String(v).trim().replace(/^\w/, (c) => c.toUpperCase());
  }
  function normalizeStatus(v) {
    const n = norm(v);
    if (!n) return "";
    if (/publicad/.test(n)) return "publicado";
    if (/aprovad/.test(n)) return "aprovado";
    if (/analise|pendente|aguardando|revis/.test(n)) return "em_analise";
    return "";
  }
  function monthFromName(s) {
    const n = norm(s);
    let i = MONTHS.indexOf(n);
    if (i < 0) i = MONTHS_SHORT.indexOf(n.slice(0, 3));
    return i >= 0 ? i + 1 : 0;
  }
  const pad = (n) => String(n).padStart(2, "0");

  /** Converte uma data em AAAA-MM-DD. ctx = {year, month}. Retorna "" se não reconhecer. */
  function parseDate(raw, ctx) {
    const s = String(raw || "").trim();
    if (!s) return "";
    ctx = ctx || {};
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return valid(+m[1], +m[2], +m[3]);
    m = s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?/);
    if (m) {
      let y = m[3] ? +m[3] : ctx.year;
      if (y && y < 100) y += 2000;
      return valid(y, +m[2], +m[1]);
    }
    m = norm(s).match(/(\d{1,2})\s*(?:de\s+)?([a-z]{3,})(?:\s*(?:de\s+)?(\d{4}))?/);
    if (m) {
      const mo = monthFromName(m[2]);
      if (mo) return valid(m[3] ? +m[3] : ctx.year, mo, +m[1]);
    }
    return "";
    function valid(y, mo, d) {
      if (!y || mo < 1 || mo > 12 || d < 1 || d > 31) return "";
      const dt = new Date(Date.UTC(y, mo - 1, d));
      if (dt.getUTCMonth() !== mo - 1) return "";
      return `${y}-${pad(mo)}-${pad(d)}`;
    }
  }

  /** "Outubro de 2026", "10/2026", "2026-10", "out/26" -> {month, year} */
  function parseMonth(raw) {
    const s = norm(raw);
    if (!s) return null;
    let m = s.match(/^(\d{4})-(\d{1,2})$/);
    if (m) return { year: +m[1], month: +m[2] };
    m = s.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{2,4})$/);
    if (m) return { month: +m[1], year: +m[2] < 100 ? 2000 + +m[2] : +m[2] };
    m = s.match(/([a-z]{3,})\s*(?:de|\/|-)?\s*(\d{2,4})?/);
    if (m) {
      const mo = monthFromName(m[1]);
      if (mo) return { month: mo, year: m[2] ? (+m[2] < 100 ? 2000 + +m[2] : +m[2]) : 0 };
    }
    return null;
  }

  function splitImages(v) {
    if (Array.isArray(v)) return v.map((x) => String(x).trim()).filter(Boolean);
    const s = String(v || "").trim();
    if (!s) return [];
    return s.split(/\s*(?:[,;\n]|\s\|\s)\s*/).map((x) => x.trim()).filter(Boolean);
  }
  const isPlaceholder = (s) => /^\[.*\]$/.test(s.trim()) || /^(arquivo\/?imagem|sem imagem|a definir|tbd|-+)$/i.test(norm(s));

  /** Normaliza um item bruto em {ref,id,date,type,title,objective,description,caption,images,status,warnings}. */
  function normalizeItem(raw, ctx, idx) {
    const get = (f) => {
      if (raw[f] != null) return raw[f];
      for (const [k, v] of Object.entries(raw)) if (fieldOf(k) === f) return v;
      return "";
    };
    const warnings = [];
    const dateRaw = String(get("date") || "").trim();
    const date = parseDate(dateRaw, ctx);
    if (!dateRaw) warnings.push("Data não informada");
    else if (!date) warnings.push(`Data não reconhecida: “${dateRaw}”`);
    const title = String(get("title") || "").trim();
    if (!title) warnings.push("Título não informado");
    const caption = String(get("caption") || "").replace(/\r/g, "").trim();
    if (!caption) warnings.push("Legenda não informada");
    const imgs = splitImages(get("image"));
    const images = imgs.filter((x) => !isPlaceholder(x));
    if (!images.length) warnings.push(imgs.length ? "Imagem citada, mas não anexada" : "Sem imagem");
    const type = normalizeType(get("type"));
    if (!type) warnings.push("Tipo não informado");
    const statusRaw = String(get("status") || "");
    return {
      ref: raw.ref != null ? String(raw.ref) : String(idx + 1),
      id: String(raw.id || "").trim(),
      date, dateRaw, type, title,
      objective: String(get("objective") || "").trim(),
      description: String(get("description") || "").replace(/\r/g, "").trim(),
      caption, images,
      status: normalizeStatus(statusRaw),
      warnings,
    };
  }

  /* ---------------- detectores de formato ---------------- */
  function tryJSON(text) {
    const t = text.trim();
    if (!/^[\[{]/.test(t)) return null;
    try {
      const j = JSON.parse(t);
      const list = Array.isArray(j) ? j : (j.contents || j.conteudos || j.posts || j.items || []);
      if (!Array.isArray(list)) return null;
      return {
        format: "JSON",
        client: Array.isArray(j) ? "" : String(j.client || j.cliente || j.empresa || ""),
        monthRaw: Array.isArray(j) ? "" : String(j.month || j.mes || j["mês"] || ""),
        yearRaw: Array.isArray(j) ? "" : String(j.year || j.ano || ""),
        rows: list.map((x) => (x && typeof x === "object" ? x : {})),
      };
    } catch (e) { return { error: "JSON inválido: " + e.message }; }
  }

  function splitRow(line, sep) {
    if (sep === "|") return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
    if (sep === "\t") return line.split("\t").map((c) => c.trim());
    // CSV simples com aspas
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  }
  function tryTable(text) {
    const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim());
    if (lines.length < 2) return null;
    for (const sep of ["\t", "|", ";", ","]) {
      const head = splitRow(lines[0], sep);
      if (head.length < 2) continue;
      const fields = head.map(fieldOf);
      if (fields.filter(Boolean).length < 2) continue;
      const rows = [];
      for (const l of lines.slice(1)) {
        if (sep === "|" && /^\s*\|?\s*:?-{2,}/.test(l)) continue;
        const cells = splitRow(l, sep);
        const r = {};
        fields.forEach((f, i) => { if (f && cells[i] != null && cells[i] !== "") r[f] = cells[i]; });
        if (Object.keys(r).length) rows.push(r);
      }
      if (rows.length) return { format: sep === "\t" ? "Tabela (colada de planilha)" : sep === "|" ? "Tabela Markdown" : "CSV", client: "", monthRaw: "", yearRaw: "", rows };
    }
    return null;
  }

  function tryText(text) {
    const lines = text.replace(/\r/g, "").split("\n");
    let client = "", monthRaw = "";
    const rows = [];
    let cur = null, curField = null, pendingHeader = null, sawField = false;
    const push = () => { if (cur && Object.keys(cur).some((k) => k !== "ref" && String(cur[k]).trim())) rows.push(cur); };
    const labelRe = /^\s*(?:[-•*]\s*)?([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ /]{1,28}?)\s*:\s*(.*)$/;
    const blockRe = /^\s*(?:#{1,4}\s*)?(?:(?:conte[uú]do|post|pe[cç]a|item)\s*)?#?(\d{1,3})\s*[.)\-–:º°]?\s*(.*)$/i;

    for (let raw of lines) {
      const line = raw.replace(/\s+$/, "");
      if (!line.trim()) { if (curField && cur && cur[curField]) cur[curField] += "\n"; continue; }
      if (/^\s*-{3,}\s*$/.test(line)) { push(); cur = null; curField = null; continue; }

      // cabeçalho "CLIENTE:" / "MÊS:" com valor na mesma linha ou na próxima
      if (pendingHeader) {
        if (!labelRe.test(line) && !blockRe.test(line)) {
          if (pendingHeader === "client") client = line.trim(); else monthRaw = line.trim();
          pendingHeader = null; continue;
        }
        pendingHeader = null;
      }
      const lm = line.match(labelRe);
      if (lm) {
        const lab = norm(lm[1]);
        if (!cur && (lab === "cliente" || lab === "empresa" || lab === "marca")) { if (lm[2].trim()) client = lm[2].trim(); else pendingHeader = "client"; continue; }
        if (!cur && (lab === "mes" || lab === "mes de referencia" || lab === "periodo" || lab === "competencia")) { if (lm[2].trim()) monthRaw = lm[2].trim(); else pendingHeader = "month"; continue; }
        if (lab === "conteudos" || lab === "planejamento" || lab === "posts") { continue; }
        const f = fieldOf(lm[1]);
        if (f) {
          sawField = true;
          if (!cur || (cur[f] != null && String(cur[f]).trim() && (f === "date" || f === "title") && !blockStarted)) {
            // sem numeração: um campo repetido abre um novo conteúdo
            if (cur && cur[f] != null && String(cur[f]).trim()) { push(); }
            cur = { ref: String(rows.length + 1) }; blockStarted = false;
          }
          cur[f] = lm[2];
          curField = f;
          continue;
        }
      }
      const bm = line.match(blockRe);
      if (bm && (/^\s*(?:#{1,4}\s*)?(conte|post|pe[cç]a|item)/i.test(line) || /^\s*\d{1,3}\s*[.)\-–:º°]/.test(line) || /^\s*\d{1,3}\s*$/.test(line))) {
        push();
        cur = { ref: bm[1] }; blockStarted = true; curField = null;
        const rest = (bm[2] || "").trim();
        if (rest) {
          const inner = rest.match(labelRe);
          if (inner && fieldOf(inner[1])) { cur[fieldOf(inner[1])] = inner[2]; curField = fieldOf(inner[1]); sawField = true; }
          else { cur.title = rest; curField = "title"; }
        }
        continue;
      }
      if (cur && curField) { cur[curField] = (cur[curField] ? cur[curField] + (cur[curField].endsWith("\n") ? "" : "\n") : "") + line.trim(); continue; }
    }
    push();
    rows.forEach((r) => Object.keys(r).forEach((k) => { if (typeof r[k] === "string") r[k] = r[k].replace(/\n{3,}/g, "\n\n").trim(); }));
    if (!rows.length || !sawField && !rows.some((r) => r.title)) return null;
    return { format: "Texto estruturado", client, monthRaw, yearRaw: "", rows };
  }
  let blockStarted = false;

  /**
   * Interpreta o texto colado.
   * Retorna {format, client, month, year, items[], errors[]}.
   */
  function parsePlanning(text, fallback) {
    fallback = fallback || {};
    const errors = [];
    const t = String(text || "").trim();
    if (!t) return { format: "", client: "", month: 0, year: 0, items: [], errors: ["Cole o planejamento no campo acima."] };
    let res = tryJSON(t);
    if (res && res.error) { errors.push(res.error); res = null; }
    if (!res) res = tryTable(t);
    if (!res) { blockStarted = false; res = tryText(t); }
    if (!res) return { format: "", client: "", month: 0, year: 0, items: [], errors: errors.length ? errors : ["Não encontrei conteúdos. Use campos como “Data:”, “Tipo:”, “Título:”, ou cole JSON / uma tabela com cabeçalho."] };
    let month = 0, year = 0;
    const pm = parseMonth(res.monthRaw);
    if (pm) { month = pm.month; year = pm.year; }
    if (res.yearRaw && +res.yearRaw) year = +res.yearRaw;
    if (!month) month = fallback.month || 0;
    if (!year) year = fallback.year || 0;
    const ctx = { month, year };
    const items = res.rows.map((r, i) => normalizeItem(r, ctx, i));
    // se o mês não veio no cabeçalho, deduz pelo mês mais frequente das datas
    if (!pm || !pm.month) {
      const counts = {};
      items.forEach((it) => { if (it.date) { const k = it.date.slice(0, 7); counts[k] = (counts[k] || 0) + 1; } });
      const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      if (best && !fallback.forceMonth) { year = +best[0].slice(0, 4); month = +best[0].slice(5, 7); }
    }
    return { format: res.format, client: res.client || "", month, year, items, errors };
  }

  /* ---------------- mesclagem ---------------- */
  const EDIT_FIELDS = ["date", "type", "title", "objective", "description", "caption"];

  /**
   * Compara itens importados com os conteúdos existentes do mesmo planejamento.
   * Correspondência somente por id explícito ou título idêntico (normalizado).
   * Nada é apagado; campos vazios na importação nunca apagam dados existentes.
   * Retorna [{item, action:'create'|'update'|'same'|'conflict'|'ambiguous', match, changes[], reason}] e untouched[].
   */
  function planMerge(items, existing) {
    existing = existing || [];
    const byId = new Map(existing.map((c) => [c.id, c]));
    const byTitle = new Map();
    existing.forEach((c) => { const k = titleKey(c.title); if (!k) return; byTitle.set(k, (byTitle.get(k) || []).concat(c)); });
    const used = new Set();
    const seenTitles = new Map();
    const rows = items.map((it) => {
      let match = null, reason = "";
      if (it.id && byId.has(it.id)) match = byId.get(it.id);
      else if (titleKey(it.title)) {
        const cands = (byTitle.get(titleKey(it.title)) || []).filter((c) => !used.has(c.id));
        if (cands.length > 1) return { item: it, action: "ambiguous", match: null, changes: [], reason: `${cands.length} conteúdos existentes com o mesmo título. Não vou adivinhar qual atualizar.` };
        if (cands.length === 1) match = cands[0];
      }
      const tk = titleKey(it.title);
      if (tk) { if (seenTitles.has(tk)) return { item: it, action: "ambiguous", match: null, changes: [], reason: "Título repetido dentro desta importação." }; seenTitles.set(tk, true); }
      if (!match) return { item: it, action: "create", match: null, changes: [], reason: "" };
      used.add(match.id);
      const changes = [];
      EDIT_FIELDS.forEach((f) => { const v = it[f]; if (v && String(v).trim() !== String(match[f] || "").trim()) changes.push(f); });
      const curImgs = (match.images && match.images.length ? match.images : (match.image ? [match.image] : []));
      // nomes de arquivo só contam como mudança quando o arquivo foi anexado nesta importação
      const urlImgs = it.images.filter((x) => /^(https?:|data:|blob:|asset:|demo\/)/i.test(x));
      if ((it._files && it._files.length) || it._attached) changes.push("images");
      else if (urlImgs.length && JSON.stringify(urlImgs) !== JSON.stringify(curImgs)) changes.push("images");
      if (!changes.length) return { item: it, action: "same", match, changes, reason: "" };
      if (match.status === "aprovado" || match.status === "publicado") {
        reason = match.status === "aprovado" ? "Este conteúdo já foi aprovado pelo cliente." : "Este conteúdo já foi publicado.";
        return { item: it, action: "conflict", match, changes, reason };
      }
      return { item: it, action: "update", match, changes, reason };
    });
    const untouched = existing.filter((c) => !used.has(c.id));
    return { rows, untouched };
  }

  /** Encontra o cliente pelo nome informado no planejamento. */
  function matchClient(name, clients) {
    const k = titleKey(name);
    if (!k) return null;
    const exact = clients.filter((c) => titleKey(c.company) === k || titleKey(c.name) === k || titleKey(c.handle) === k.replace(/^@/, ""));
    if (exact.length === 1) return exact[0];
    const part = clients.filter((c) => titleKey(c.company).includes(k) || k.includes(titleKey(c.company)));
    return part.length === 1 ? part[0] : null;
  }

  const FIELD_LABELS = { date: "data", type: "tipo", title: "título", objective: "objetivo", description: "descrição", caption: "legenda", images: "imagem" };

  const api = { parsePlanning, planMerge, parseDate, parseMonth, normalizeType, normalizeStatus, normalizeItem, matchClient, titleKey, norm, MONTHS, FIELD_LABELS };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.VAParse = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ============================================================
   Camada de dados do portal — uma interface, três adaptadores.

   ArtifactStore  -> banco real do Claude (capability `db`) + imagens (`assets`)
   SupabaseStore  -> produção: Postgres + RLS + login do cliente validado no servidor
   LocalStore     -> demonstração em memória (nada é salvo), quando não há banco

   A interface usada pelas telas:
     init()                         -> prepara o adaptador
     info                           -> {mode, label, persistent, serverIsolation, codesVisible, canUploadImages}
     watchPublic(cb)                -> {brand, demoCredentials}
     clientLogin(email, code)       -> sessão do cliente
     restoreClient()                -> sessão salva (ou null)
     clientLogout()
     watchClient(session, cb)       -> {client, plannings, contents, comments}
     approve(session, contentId)
     sendComment(session, contentId, text, kind)   kind: 'comment' | 'change_request'
     adminAccess()                  -> {ok, reason, needsLogin}
     adminLogin(email, password)    (somente Supabase)
     watchAdmin(cb)                 -> {clients, vault, plannings, contents, comments, notifications}
     setStatus(contentId, status) / resolveChange(contentId) / agencyComment(contentId, text)
     markRead(ids) / saveClient(data) / regenerateCode(clientId) / deleteContent(id)
     applyImport(plan) / uploadImage(file) / saveBrand(brand) / clearDemo() / loadDemo(seed)
   ============================================================ */
(function (root) {
  "use strict";

  const nowISO = () => new Date().toISOString();
  const uid = (p) => (p || "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  function makeCode(n) {
    n = n || 6;
    const a = new Uint32Array(n); (root.crypto || globalThis.crypto).getRandomValues(a);
    return Array.from(a, (x) => CODE_ALPHABET[x % CODE_ALPHABET.length]).join("");
  }
  async function accessHash(email, code) {
    const txt = `va-midia|${String(email).trim().toLowerCase()}|${String(code).trim().toUpperCase()}`;
    const buf = await (root.crypto || globalThis.crypto).subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  }
  const safeLS = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  class PortalError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }

  /* ---------- regras comuns (mesmas em todos os adaptadores) ---------- */
  function approvalPatch(d, by) {
    const at = nowISO();
    return { status: "aprovado", approvedAt: at, changeRequested: false, updatedAt: at, history: (d.history || []).concat({ status: "aprovado", at, by: by || "Cliente" }) };
  }
  function statusPatch(d, status) {
    const at = nowISO();
    const p = { status, updatedAt: at, history: (d.history || []).concat({ status, at, by: "VA Mídia" }) };
    if (status === "aprovado" && !d.approvedAt) p.approvedAt = at;
    if (status === "publicado") { p.publishedAt = at; if (!d.approvedAt) p.approvedAt = at; }
    if (status === "em_analise") { p.approvedAt = null; p.publishedAt = null; }
    if (status !== "publicado" && d.publishedAt && status !== "em_analise") p.publishedAt = null;
    return p;
  }
  function checkText(text) {
    const t = String(text || "").trim();
    if (!t) throw new PortalError("empty", "Escreva sua mensagem antes de enviar.");
    if (t.length > 2000) throw new PortalError("too_long", "A mensagem passou de 2.000 caracteres. Resuma um pouco.");
    return t;
  }

  /* ============================================================
     ArtifactStore — banco do Claude
     ============================================================ */
  class ArtifactStore {
    constructor(db, caps) {
      this.db = db; this.user = caps.user; this.assets = caps.assets; this.sample = caps.sample;
      this.info = { mode: "artifact", label: "Banco de dados do portal", persistent: true, serverIsolation: false, codesVisible: true, canUploadImages: !!caps.assets, canUseAI: !!caps.sample };
    }
    async init() {
      this.canEdit = this.user ? await this.user.canEdit().catch(() => false) : null;
      this.canWrite = this.user ? await this.user.can("data.write").catch(() => null) : null;
    }
    _sub(q, cb, onErr) { return q.onSnapshot(cb, (e) => onErr && onErr(e)); }
    _docs(snap) { return snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); }

    watchPublic(cb) {
      const st = { brand: null, demoCredentials: [] };
      const u1 = this.db.doc("settings/brand").onSnapshot((s) => { st.brand = s.exists ? s.data() : null; cb(Object.assign({}, st)); }, () => {});
      const u2 = this.db.doc("demo/credentials").onSnapshot((s) => { st.demoCredentials = s.exists ? (s.data().items || []) : []; cb(Object.assign({}, st)); }, () => {});
      return () => { u1(); u2(); };
    }

    async clientLogin(email, code) {
      email = String(email || "").trim(); code = String(code || "").trim();
      if (!email || !code) throw new PortalError("missing", "Informe o e-mail e o código de acesso.");
      const h = await accessHash(email, code);
      const snap = await this.db.doc("access/" + h).get();
      if (!snap.exists) throw new PortalError("invalid", "E-mail ou código não conferem. Confira os dados enviados pela VA Mídia.");
      const clientId = snap.data().clientId;
      const c = await this.db.doc("clients/" + clientId).get();
      if (!c.exists) throw new PortalError("invalid", "Este acesso não está mais ativo. Fale com a VA Mídia.");
      const client = Object.assign({ id: c.id }, c.data());
      if (client.status === "inativo") throw new PortalError("inactive", "Este acesso está pausado. Fale com a VA Mídia.");
      const session = { kind: "client", clientId, key: h };
      safeLS.set("va.session", session);
      return Object.assign({}, session, { client });
    }
    async restoreClient() {
      const s = safeLS.get("va.session");
      if (!s || s.kind !== "client" || !s.key) return null;
      const snap = await this.db.doc("access/" + s.key).get().catch(() => null);
      if (!snap || !snap.exists || snap.data().clientId !== s.clientId) { safeLS.del("va.session"); return null; }
      const c = await this.db.doc("clients/" + s.clientId).get();
      if (!c.exists || c.data().status === "inativo") { safeLS.del("va.session"); return null; }
      return Object.assign({}, s, { client: Object.assign({ id: c.id }, c.data()) });
    }
    clientLogout() { safeLS.del("va.session"); }

    watchClient(session, cb, onErr) {
      const id = session.clientId;
      const st = { client: session.client, plannings: null, contents: null, comments: null };
      const emit = () => { if (st.plannings && st.contents && st.comments) cb(Object.assign({}, st)); };
      const subs = [
        this.db.doc("clients/" + id).onSnapshot((s) => { if (s.exists) { st.client = Object.assign({ id }, s.data()); emit(); } }, onErr),
        this._sub(this.db.collection("plannings").where("clientId", "==", id), (s) => { st.plannings = this._docs(s); emit(); }, onErr),
        this._sub(this.db.collection("contents").where("clientId", "==", id), (s) => { st.contents = this._docs(s); emit(); }, onErr),
        this._sub(this.db.collection("comments").where("clientId", "==", id), (s) => { st.comments = this._docs(s); emit(); }, onErr),
      ];
      return () => subs.forEach((u) => u());
    }

    async _ownContent(session, contentId) {
      const ref = this.db.doc("contents/" + contentId);
      const s = await ref.get();
      if (!s.exists) throw new PortalError("not_found", "Conteúdo não encontrado.");
      const d = s.data();
      if (d.clientId !== session.clientId) throw new PortalError("forbidden", "Este conteúdo não pertence ao seu planejamento.");
      return { ref, d };
    }
    async _notify(n) { await this.db.collection("notifications").add(Object.assign({ read: false, createdAt: nowISO() }, n)); }

    async approve(session, contentId) {
      const { ref, d } = await this._ownContent(session, contentId);
      if (d.status !== "em_analise") return { already: true };
      const patch = approvalPatch(d, session.client && session.client.name);
      await ref.update(patch);
      await this._notify({ clientId: session.clientId, contentId, type: "approval", message: "Conteúdo aprovado", clientName: session.client.company, contentTitle: d.title || "" });
      return { approvedAt: patch.approvedAt };
    }
    async sendComment(session, contentId, text, kind) {
      const t = checkText(text);
      const { ref, d } = await this._ownContent(session, contentId);
      if (kind === "change_request" && d.status !== "em_analise") throw new PortalError("closed", "Este conteúdo já foi aprovado. Use os comentários para falar com a VA Mídia.");
      const at = nowISO();
      await this.db.collection("comments").add({ contentId, clientId: session.clientId, planningId: d.planningId, authorRole: "client", authorName: session.client.name || session.client.company, kind: kind === "change_request" ? "change_request" : "comment", message: t, createdAt: at });
      if (kind === "change_request") await ref.update({ changeRequested: true, updatedAt: at });
      await this._notify({ clientId: session.clientId, contentId, type: kind === "change_request" ? "change_request" : "comment", message: t, clientName: session.client.company, contentTitle: d.title || "" });
    }

    async adminAccess() {
      if (this.canEdit) return { ok: true };
      if (this.canEdit === null) return { ok: true, uncertain: true };
      return { ok: false, reason: "A área da VA Mídia é liberada para quem tem acesso de edição a este portal no Claude." };
    }
    watchAdmin(cb, onErr) {
      const names = ["clients", "vault", "plannings", "contents", "comments", "notifications"];
      const st = {};
      const emit = () => { if (names.every((n) => st[n])) cb(Object.assign({}, st)); };
      const subs = names.map((n) => this._sub(this.db.collection(n), (s) => { st[n] = this._docs(s); emit(); }, onErr));
      return () => subs.forEach((u) => u());
    }
    async setStatus(contentId, status) {
      const ref = this.db.doc("contents/" + contentId); const s = await ref.get();
      if (!s.exists) throw new PortalError("not_found", "Conteúdo não encontrado.");
      if (s.data().status === status) return;
      await ref.update(statusPatch(s.data(), status));
    }
    async resolveChange(contentId) { await this.db.doc("contents/" + contentId).update({ changeRequested: false, updatedAt: nowISO() }); }
    async agencyComment(contentId, text) {
      const t = checkText(text);
      const s = await this.db.doc("contents/" + contentId).get();
      if (!s.exists) throw new PortalError("not_found", "Conteúdo não encontrado.");
      const d = s.data();
      await this.db.collection("comments").add({ contentId, clientId: d.clientId, planningId: d.planningId, authorRole: "agency", authorName: "VA Mídia", kind: "comment", message: t, createdAt: nowISO() });
    }
    async markRead(ids) { for (const id of ids) await this.db.doc("notifications/" + id).update({ read: true }).catch(() => {}); }
    async setContentImage(contentId, imageRef) { await this.db.doc("contents/" + contentId).update({ image: imageRef, images: [], updatedAt: nowISO() }); }
    async deleteContent(id) {
      const cm = await this.db.collection("comments").where("contentId", "==", id).get();
      for (const d of cm.docs) await this.db.doc("comments/" + d.id).delete();
      const nt = await this.db.collection("notifications").where("contentId", "==", id).get();
      for (const d of nt.docs) await this.db.doc("notifications/" + d.id).delete();
      await this.db.doc("contents/" + id).delete();
    }

    async saveClient(data) {
      const id = data.id || uid("cl-");
      const company = String(data.company || "").trim();
      const email = String(data.email || "").trim().toLowerCase();
      if (!company || !email) throw new PortalError("missing", "Empresa e e-mail são obrigatórios.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new PortalError("email", "Confira o e-mail do cliente.");
      const prev = data.id ? await this.db.doc("vault/" + id).get() : null;
      const prevV = prev && prev.exists ? prev.data() : null;
      const code = String(data.code || (prevV && prevV.code) || makeCode()).trim().toUpperCase();
      if (code.length < 5) throw new PortalError("code", "Use um código com pelo menos 5 caracteres.");
      const all = await this.db.collection("vault").get();
      if (all.docs.some((d) => d.id !== id && d.data().email === email)) throw new PortalError("dup", "Já existe um cliente com este e-mail.");
      const prevClient = data.id ? await this.db.doc("clients/" + id).get() : null;
      await this.db.doc("clients/" + id).set({
        name: String(data.name || "").trim(), company, handle: String(data.handle || "").trim().replace(/^@/, ""),
        status: data.status || "ativo", demo: !!(prevClient && prevClient.exists && prevClient.data().demo),
        createdAt: prevClient && prevClient.exists ? prevClient.data().createdAt : nowISO(),
      });
      if (prevV) { const oh = await accessHash(prevV.email, prevV.code); if (prevV.email !== email || prevV.code !== code) await this.db.doc("access/" + oh).delete(); }
      await this.db.doc("vault/" + id).set({ email, code });
      await this.db.doc("access/" + (await accessHash(email, code))).set({ clientId: id });
      return { id, code };
    }
    async regenerateCode(clientId) {
      const v = await this.db.doc("vault/" + clientId).get();
      if (!v.exists) throw new PortalError("not_found", "Cliente sem e-mail cadastrado.");
      const c = await this.db.doc("clients/" + clientId).get();
      return this.saveClient(Object.assign({ id: clientId }, c.data(), { email: v.data().email, code: makeCode() }));
    }

    async uploadImage(file) {
      if (!this.assets) throw new PortalError("no_assets", "O envio de imagens não está disponível nesta visualização.");
      const type = file.type || (/\.png$/i.test(file.name) ? "image/png" : /\.webp$/i.test(file.name) ? "image/webp" : /\.gif$/i.test(file.name) ? "image/gif" : "image/jpeg");
      try {
        const r = await this.assets.upload(file, { type });
        return "asset:" + r.id;
      } catch (e) {
        const m = { too_large: "Imagem acima de 20 MB.", unsupported_type: "Formato de imagem não aceito (use JPG, PNG, WebP ou GIF).", quota_or_state: "O espaço de imagens do portal está cheio.", rate_limited: "Muitos envios seguidos. Tente de novo em instantes." };
        throw new PortalError(e.code || "upload", m[e.code] || "Não foi possível enviar a imagem.");
      }
    }
    async saveBrand(brand) { await this.db.doc("settings/brand").set(brand || {}); }

    /** plan = {clientId, planning:{id, create, month, year, title}, ops:[{kind:'create'|'update', id?, data}]} */
    async applyImport(plan) {
      if (plan.planning.create) await this.db.doc("plannings/" + plan.planning.id).set({ clientId: plan.clientId, month: plan.planning.month, year: plan.planning.year, title: plan.planning.title, createdAt: nowISO() });
      for (const op of plan.ops) {
        if (op.kind === "create") await this.db.doc("contents/" + op.id).set(op.data);
        else await this.db.doc("contents/" + op.id).update(op.data);
      }
    }

    async clearDemo() {
      for (const col of ["notifications", "comments", "contents", "plannings", "access", "clients"]) {
        const s = await this.db.collection(col).where("demo", "==", true).get();
        for (const d of s.docs) await this.db.doc(col + "/" + d.id).delete();
      }
      const v = await this.db.collection("vault").get();
      for (const d of v.docs) if (/^demo-/.test(d.id)) await this.db.doc("vault/" + d.id).delete();
      await this.db.doc("demo/credentials").delete();
    }
    async loadDemo(seed) {
      const put = (p, o) => { const x = Object.assign({}, o); delete x.id; return this.db.doc(p).set(x); };
      for (const c of seed.clients) await put("clients/" + c.id, c);
      for (const v of seed.vault) await put("vault/" + v.id, v);
      for (const a of seed.access) await put("access/" + a.id, Object.assign({}, a, { demo: true }));
      for (const p of seed.plannings) await put("plannings/" + p.id, p);
      for (const c of seed.contents) await put("contents/" + c.id, c);
      for (const c of seed.comments) await put("comments/" + c.id, c);
      for (const n of seed.notifications) await put("notifications/" + n.id, n);
      await this.db.doc("demo/credentials").set({ items: seed.demoCredentials, aviso: "Acessos de DEMONSTRAÇÃO" });
    }
  }

  /* ============================================================
     LocalStore — demonstração em memória (sem persistência)
     ============================================================ */
  class LocalStore {
    constructor() {
      this.info = { mode: "local", label: "Demonstração local", persistent: false, serverIsolation: false, codesVisible: true, canUploadImages: true, canUseAI: false };
      this.d = { clients: [], vault: [], access: [], plannings: [], contents: [], comments: [], notifications: [], brand: null, demoCredentials: [] };
      this.listeners = new Set();
    }
    async init() {}
    _emit() { this.listeners.forEach((f) => f()); }
    _on(f) { this.listeners.add(f); f(); return () => this.listeners.delete(f); }
    watchPublic(cb) { return this._on(() => cb({ brand: this.d.brand, demoCredentials: this.d.demoCredentials })); }
    async clientLogin(email, code) {
      email = String(email || "").trim(); code = String(code || "").trim();
      if (!email || !code) throw new PortalError("missing", "Informe o e-mail e o código de acesso.");
      const h = await accessHash(email, code);
      const a = this.d.access.find((x) => x.id === h);
      if (!a) throw new PortalError("invalid", "E-mail ou código não conferem. Confira os dados enviados pela VA Mídia.");
      const client = this.d.clients.find((c) => c.id === a.clientId);
      if (!client) throw new PortalError("invalid", "Este acesso não está mais ativo.");
      if (client.status === "inativo") throw new PortalError("inactive", "Este acesso está pausado. Fale com a VA Mídia.");
      return { kind: "client", clientId: client.id, key: h, client };
    }
    async restoreClient() { return null; }
    clientLogout() {}
    watchClient(session, cb) {
      return this._on(() => {
        const id = session.clientId;
        cb({ client: this.d.clients.find((c) => c.id === id) || session.client, plannings: this.d.plannings.filter((p) => p.clientId === id), contents: this.d.contents.filter((c) => c.clientId === id), comments: this.d.comments.filter((c) => c.clientId === id) });
      });
    }
    _own(session, id) {
      const c = this.d.contents.find((x) => x.id === id);
      if (!c) throw new PortalError("not_found", "Conteúdo não encontrado.");
      if (c.clientId !== session.clientId) throw new PortalError("forbidden", "Este conteúdo não pertence ao seu planejamento.");
      return c;
    }
    _replace(id, patch) { this.d.contents = this.d.contents.map((c) => (c.id === id ? Object.assign({}, c, patch) : c)); }
    async approve(session, id) {
      const c = this._own(session, id);
      if (c.status !== "em_analise") return { already: true };
      const p = approvalPatch(c, session.client.name); this._replace(id, p);
      this.d.notifications = this.d.notifications.concat({ id: uid("nt-"), clientId: c.clientId, contentId: id, type: "approval", message: "Conteúdo aprovado", read: false, createdAt: nowISO(), clientName: session.client.company, contentTitle: c.title });
      this._emit(); return { approvedAt: p.approvedAt };
    }
    async sendComment(session, id, text, kind) {
      const t = checkText(text); const c = this._own(session, id);
      if (kind === "change_request" && c.status !== "em_analise") throw new PortalError("closed", "Este conteúdo já foi aprovado. Use os comentários para falar com a VA Mídia.");
      const at = nowISO();
      this.d.comments = this.d.comments.concat({ id: uid("cm-"), contentId: id, clientId: c.clientId, planningId: c.planningId, authorRole: "client", authorName: session.client.name || session.client.company, kind: kind === "change_request" ? "change_request" : "comment", message: t, createdAt: at });
      if (kind === "change_request") this._replace(id, { changeRequested: true, updatedAt: at });
      this.d.notifications = this.d.notifications.concat({ id: uid("nt-"), clientId: c.clientId, contentId: id, type: kind === "change_request" ? "change_request" : "comment", message: t, read: false, createdAt: at, clientName: session.client.company, contentTitle: c.title });
      this._emit();
    }
    async adminAccess() { return { ok: true }; }
    watchAdmin(cb) { return this._on(() => cb({ clients: this.d.clients, vault: this.d.vault, plannings: this.d.plannings, contents: this.d.contents, comments: this.d.comments, notifications: this.d.notifications })); }
    async setStatus(id, status) { const c = this.d.contents.find((x) => x.id === id); if (!c || c.status === status) return; this._replace(id, statusPatch(c, status)); this._emit(); }
    async resolveChange(id) { this._replace(id, { changeRequested: false }); this._emit(); }
    async agencyComment(id, text) { const t = checkText(text); const c = this.d.contents.find((x) => x.id === id); this.d.comments = this.d.comments.concat({ id: uid("cm-"), contentId: id, clientId: c.clientId, planningId: c.planningId, authorRole: "agency", authorName: "VA Mídia", kind: "comment", message: t, createdAt: nowISO() }); this._emit(); }
    async markRead(ids) { this.d.notifications = this.d.notifications.map((n) => (ids.includes(n.id) ? Object.assign({}, n, { read: true }) : n)); this._emit(); }
    async setContentImage(id, ref) { this._replace(id, { image: ref, images: [] }); this._emit(); }
    async deleteContent(id) { this.d.contents = this.d.contents.filter((c) => c.id !== id); this.d.comments = this.d.comments.filter((c) => c.contentId !== id); this.d.notifications = this.d.notifications.filter((c) => c.contentId !== id); this._emit(); }
    async saveClient(data) {
      const id = data.id || uid("cl-");
      const company = String(data.company || "").trim(); const email = String(data.email || "").trim().toLowerCase();
      if (!company || !email) throw new PortalError("missing", "Empresa e e-mail são obrigatórios.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new PortalError("email", "Confira o e-mail do cliente.");
      if (this.d.vault.some((v) => v.id !== id && v.email === email)) throw new PortalError("dup", "Já existe um cliente com este e-mail.");
      const prevV = this.d.vault.find((v) => v.id === id);
      const code = String(data.code || (prevV && prevV.code) || makeCode()).toUpperCase();
      if (code.length < 5) throw new PortalError("code", "Use um código com pelo menos 5 caracteres.");
      const prev = this.d.clients.find((c) => c.id === id);
      const client = { id, name: String(data.name || "").trim(), company, handle: String(data.handle || "").replace(/^@/, "").trim(), status: data.status || "ativo", demo: !!(prev && prev.demo), createdAt: prev ? prev.createdAt : nowISO() };
      this.d.clients = this.d.clients.filter((c) => c.id !== id).concat(client);
      if (prevV) { const oh = await accessHash(prevV.email, prevV.code); this.d.access = this.d.access.filter((a) => a.id !== oh); }
      this.d.vault = this.d.vault.filter((v) => v.id !== id).concat({ id, email, code });
      this.d.access = this.d.access.concat({ id: await accessHash(email, code), clientId: id });
      this._emit(); return { id, code };
    }
    async regenerateCode(clientId) { const v = this.d.vault.find((x) => x.id === clientId); const c = this.d.clients.find((x) => x.id === clientId); return this.saveClient(Object.assign({}, c, { email: v.email, code: makeCode() })); }
    async uploadImage(file) { return URL.createObjectURL(file); }
    async saveBrand(b) { this.d.brand = b; this._emit(); }
    async applyImport(plan) {
      if (plan.planning.create) this.d.plannings = this.d.plannings.concat({ id: plan.planning.id, clientId: plan.clientId, month: plan.planning.month, year: plan.planning.year, title: plan.planning.title, createdAt: nowISO() });
      for (const op of plan.ops) {
        if (op.kind === "create") this.d.contents = this.d.contents.concat(Object.assign({ id: op.id }, op.data));
        else this._replace(op.id, op.data);
      }
      this._emit();
    }
    async clearDemo() {
      const keep = (x) => !x.demo;
      ["clients", "plannings", "contents", "comments", "notifications"].forEach((k) => (this.d[k] = this.d[k].filter(keep)));
      this.d.vault = this.d.vault.filter((v) => !/^demo-/.test(v.id)); this.d.access = this.d.access.filter((a) => !/^demo-/.test(a.clientId)); this.d.demoCredentials = [];
      this._emit();
    }
    async loadDemo(seed) {
      const ids = new Set(seed.clients.map((c) => c.id));
      ["clients", "vault", "access", "plannings", "contents", "comments", "notifications"].forEach((k) => {
        const incoming = seed[k] || [];
        const inIds = new Set(incoming.map((x) => x.id));
        this.d[k] = this.d[k].filter((x) => !inIds.has(x.id)).concat(JSON.parse(JSON.stringify(incoming)));
      });
      this.d.demoCredentials = seed.demoCredentials; void ids;
      this._emit();
    }
  }

  /* ============================================================
     SupabaseStore — produção (ver producao/schema.sql)
     Cliente: só acessa por funções RPC que validam o token no servidor.
     Equipe: login do Supabase Auth + tabela `admins` + RLS.
     ============================================================ */
  const snake = (s) => s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase());
  const camel = (s) => s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
  const toCamel = (o) => { const r = {}; Object.keys(o || {}).forEach((k) => (r[camel(k)] = o[k])); return r; };
  const toSnake = (o) => { const r = {}; Object.keys(o || {}).forEach((k) => (r[snake(k)] = o[k])); return r; };
  const CONTENT_COLS = ["planning_id", "client_id", "position", "ref", "date", "type", "title", "objective", "description", "caption", "image", "images", "status", "change_requested", "approved_at", "published_at", "history", "updated_at", "is_demo"];

  class SupabaseStore {
    constructor(cfg) {
      this.cfg = cfg;
      this.info = { mode: "supabase", label: "Servidor Supabase", persistent: true, serverIsolation: true, codesVisible: false, canUploadImages: true, canUseAI: false };
    }
    async init() {
      if (!root.supabase || !root.supabase.createClient) throw new PortalError("sdk", "Biblioteca do Supabase não carregou.");
      this.sb = root.supabase.createClient(this.cfg.supabaseUrl, this.cfg.supabaseAnonKey, { auth: { persistSession: true } });
    }
    async _rpc(fn, args) {
      const { data, error } = await this.sb.rpc(fn, args);
      if (error) {
        const m = String(error.message || "");
        const known = { invalid_login: "E-mail ou código não conferem. Confira os dados enviados pela VA Mídia.", too_many_attempts: "Muitas tentativas. Aguarde 15 minutos e tente de novo.", inactive: "Este acesso está pausado. Fale com a VA Mídia.", session_expired: "Sua sessão expirou. Entre novamente.", not_found: "Conteúdo não encontrado.", closed: "Este conteúdo já foi aprovado. Use os comentários para falar com a VA Mídia.", forbidden: "Acesso negado." };
        const code = Object.keys(known).find((k) => m.includes(k)) || "server";
        throw new PortalError(code, known[code] || ("Não foi possível falar com o servidor. Detalhe: " + (m || "sem resposta")));
      }
      return data;
    }
    _mapContent(r) { const c = toCamel(r); c.demo = r.is_demo; c.order = r.position; return c; }

    watchPublic(cb) {

    }

    async uploadImage(file) {

    async applyImport(plan) {

        if (error) throw new PortalError("server", error.message);

        } else await this._updContent(op.id, op.data);

    async loadDemo() { throw new PortalError("unsupported", "No Supabase, carregue a demonstração com o arquivo producao/seed-demo.sql."); }
  }

})(typeof window !== "undefined" ? window : globalThis);

      <button class="btn btn-primary" data-a="go-login">Sou cliente — acessar planejamento</button></div>
      <button class="linkish back-link" data-a="go-home">Voltar para o início</button></div></div></main>`;

  /* ---------------- blocos compartilhados ---------------- */
  function planningsFor(data, clientId) { return (data.plannings || []).filter((p) => p.clientId === clientId).sort(byPlanning); }
  function pickPlanning(data, clientId, key) {
    const list = planningsFor(data, clientId);
    if (!list.length) return null;
    const chosen = list.find((p) => p.id === S.planningId[key]);
    if (chosen) return chosen;
    const withPending = list.find((p) => (data.contents || []).some((c) => c.planningId === p.id && c.status === "em_analise"));
    return withPending || list[0];
  }
  function counts(list) {
    const c = { all: list.length, em_analise: 0, aprovado: 0, publicado: 0, change: 0 };
    list.forEach((x) => { c[x.status] = (c[x.status] || 0) + 1; if (x.changeRequested && x.status === "em_analise") c.change++; });
    return c;
  }
  function summaryBar(c) {
    const items = [["all", "Conteúdos", c.all], ["em_analise", "Em análise", c.em_analise], ["aprovado", "Aprovados", c.aprovado], ["publicado", "Publicados", c.publicado]];
    return `<div class="summary" role="group" aria-label="Resumo e filtros">${items.map(([k, lab, v]) => `<button class="sum ${k}" data-a="filter" data-f="${k}" aria-pressed="${S.filter === k}"><span class="v">${pad(v)}</span><span class="k"><i></i>${lab}</span></button>`).join("")}</div>`;
  }
  function monthChips(list, current, key) {
    if (list.length < 2) return "";
    return `<div class="month-switch" role="group" aria-label="Mês do planejamento">${list.map((p) => `<button class="chip" data-a="planning" data-key="${esc(key)}" data-id="${esc(p.id)}" aria-pressed="${p.id === current.id}">${monthShort(p.month, p.year)}</button>`).join("")}</div>`;
  }
  function mediaHTML(src, alt) {
    if (!src) return `<span class="noimg">${I.image}<span>Imagem não fornecida</span></span>`;
    return `<img src="${esc(src)}" alt="${esc(alt || "")}" loading="lazy" data-fallback>`;
  }
  function tileHTML(c, i, cmCount, animate) {
    const d = day(c.date);
    const imgs = imagesOf(c);
    return `<button class="tile" data-a="open" data-id="${esc(c.id)}" style="${animate ? `animation-delay:${Math.min(i, 12) * 35}ms` : "animation:none"}" aria-label="${esc((c.title || "Sem título") + ", " + (d ? d.long : "data não informada") + ", " + STATUS[c.status])}">
      <span class="media" style="display:block">${mediaHTML(imgSrc(imgs[0]), c.title)}
        <span class="num">#${pad(c.order || i + 1)}</span>
        <span class="fmt" title="${esc(c.type || "")}">${typeIcon(c.type)}</span>
        ${c.changeRequested && c.status === "em_analise" || cmCount ? `<span class="flag">${c.changeRequested && c.status === "em_analise" ? `<span>${I.edit}Alteração solicitada</span>` : ""}${cmCount ? `<span class="cm">${I.chat}${cmCount}</span>` : ""}</span>` : ""}
      </span>
      <span class="meta"><span class="when"><b>${d ? d.short : "SEM DATA"}</b> · ${esc(c.type ? c.type.toUpperCase() : "—")}</span><span class="status ${esc(c.status)}">${STATUS[c.status] || c.status}</span></span>
      <span class="ttl${c.title ? "" : " none"}">${esc(c.title || "Título não informado")}</span>
    </button>`;
  }
  function feedHTML(list, comments, emptyText) {
    const animKey = S.view + "|" + S.filter + "|" + list.map((c) => c.id).join(",");
    const animate = animKey !== S.animKey; S.animKey = animKey;
    if (!list.length) return `<div class="empty">${I.inbox}<b>${esc(emptyText[0])}</b><span>${esc(emptyText[1])}</span></div>`;
    const cc = {}; (comments || []).forEach((m) => (cc[m.contentId] = (cc[m.contentId] || 0) + 1));
    return `<div class="feed">${list.map((c, i) => tileHTML(c, i, cc[c.id] || 0, animate)).join("")}</div>`;
  }
  const EMPTY = {
    all: ["Nenhum conteúdo neste planejamento", "Assim que a VA Mídia publicar o planejamento, ele aparece aqui."],
    em_analise: ["Nada aguardando análise", "Todos os conteúdos deste mês já foram revisados."],
    aprovado: ["Nenhum conteúdo aprovado ainda", "Os conteúdos que você aprovar aparecem aqui."],
    publicado: ["Nenhum conteúdo publicado ainda", "Depois de produzido e aprovado, o conteúdo publicado aparece aqui."],
  };

  /* ---------------- dashboard do cliente ---------------- */
  function viewClient() {
    const s = S.session, d = S.cdata;
    const client = (d && d.client) || s.client;
    const top = `<header class="topbar"><div class="wrap">${brandHTML("Portal de Aprovação")}<span class="spacer"></span>
      <span class="who"><b>${esc(client.company)}</b><small>${client.handle ? "@" + esc(client.handle) : ""}</small></span>
      <button class="btn btn-ghost btn-sm" data-a="logout">${I.out}<span>Sair</span></button></div></header>`;
    if (!d) return top + `<div class="wrap page">${viewBoot()}</div>`;
    const planning = pickPlanning(d, client.id, "client");
    const hello = `<h1>Olá, ${esc(client.name || client.company)}</h1>`;
    if (!planning) return top + `<main class="wrap page"><div class="greet"><div>${hello}<p class="sub">Planejamento de conteúdo</p></div></div>
      <div class="empty" style="margin-top:30px">${I.inbox}<b>Seu planejamento ainda não foi publicado</b><span>Quando a VA Mídia publicar o planejamento do mês, ele aparece aqui.</span></div></main>`;
    const all = d.contents.filter((c) => c.planningId === planning.id).sort(byDate);
    const c = counts(all);
    const shown = S.filter === "all" ? all : all.filter((x) => x.status === S.filter);
    const pending = all.filter((x) => x.status === "em_analise" && !x.changeRequested);
    const changes = all.filter((x) => x.status === "em_analise" && x.changeRequested);
    let callout;
    if (pending.length) callout = `<div class="callout"><span class="ic">${I.bell}</span><span class="tx"><b>${pending.length === 1 ? "1 conteúdo aguardando sua aprovação" : pending.length + " conteúdos aguardando sua aprovação"}</b><span>Abra cada um, confira a arte e a legenda, e aprove ou peça um ajuste.${changes.length ? ` ${changes.length === 1 ? "1 alteração pedida por você está" : changes.length + " alterações pedidas por você estão"} com a VA Mídia.` : ""}</span></span><button class="btn btn-primary" data-a="open" data-id="${esc(pending[0].id)}">Revisar agora ${I.arrow}</button></div>`;
    else if (changes.length) callout = `<div class="callout calm"><span class="ic" style="background:var(--danger-bg);color:var(--danger)">${I.edit}</span><span class="tx"><b>${changes.length === 1 ? "1 alteração em andamento" : changes.length + " alterações em andamento"}</b><span>A VA Mídia está ajustando o que você pediu. Os demais conteúdos já foram revisados.</span></span></div>`;
    else callout = `<div class="callout calm"><span class="ic">${I.check}</span><span class="tx"><b>Tudo em dia</b><span>Nenhum conteúdo aguardando você neste mês.</span></span></div>`;
    return top + `<main class="wrap page">
      <div class="greet"><div>${hello}<p class="sub"><span>Planejamento de conteúdo · <b style="color:var(--text)">${monthName(planning.month, planning.year)}</b></span>${client.demo ? '<span class="tag demo">Demonstração</span>' : ""}</p></div>
      ${monthChips(planningsFor(d, client.id), planning, "client")}</div>
      ${callout}
      ${summaryBar(c)}
      <div class="feed-head"><h2>${S.filter === "all" ? "Feed do mês" : STATUS[S.filter]} · ${shown.length}</h2><span class="hint">Toque em um conteúdo para ver os detalhes</span></div>
      ${feedHTML(shown, d.comments, EMPTY[S.filter])}
    </main>`;
  }

  /* ---------------- detalhe do conteúdo ---------------- */
  function currentContext() {
    if (!S.open) return null;
    const isAdmin = S.open.from === "admin";
    const data = isAdmin ? S.adata : S.cdata;
    if (!data) return null;
    const c = data.contents.find((x) => x.id === S.open.id);
    if (!c) return null;
    const client = isAdmin ? (data.clients.find((x) => x.id === c.clientId) || { company: "", handle: "" }) : (data.client || S.session.client);
    const siblings = data.contents.filter((x) => x.planningId === c.planningId).sort(byDate);
    const filtered = S.open.filter && S.open.filter !== "all" ? siblings.filter((x) => x.status === S.open.filter) : siblings;
    const nav = filtered.some((x) => x.id === c.id) ? filtered : siblings;
    const comments = (data.comments || []).filter((m) => m.contentId === c.id).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    return { isAdmin, data, c, client, nav, comments, idx: nav.findIndex((x) => x.id === c.id) };
  }

  function viewDetail() {
    const ctx = currentContext();
    if (!ctx) return "";
    const { c, client, nav, idx, isAdmin } = ctx;
    const d = day(c.date);
    const prev = nav[idx - 1], next = nav[idx + 1];
    return `<div class="overlay" data-a="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt-title">
      <div class="sheet-head">
        <button class="btn btn-ghost btn-sm" data-a="close" id="dt-close">${I.back}<span>Voltar ao planejamento</span></button>
        <span class="t">Conteúdo #${pad(c.order || idx + 1)} · ${d ? d.full : "Data não informada"}${isAdmin ? " · " + esc(client.company) : ""}</span>
        <button class="icon-btn" data-a="nav" data-id="${prev ? esc(prev.id) : ""}" ${prev ? "" : "disabled style=\"opacity:.35\""} aria-label="Conteúdo anterior">${I.left}</button>
        <button class="icon-btn" data-a="nav" data-id="${next ? esc(next.id) : ""}" ${next ? "" : "disabled style=\"opacity:.35\""} aria-label="Próximo conteúdo">${I.right}</button>
      </div>
      <div class="sheet-body">
        <div>${postPreview(c, client)}</div>
        <div class="side">
          <h2 id="dt-title" class="${c.title ? "" : "none"}">${esc(c.title || "Título não informado")}</h2>
          ${isAdmin ? adminStatePanel(ctx) : clientStateCard(ctx)}
          ${infoList(c)}
          ${threadHTML(ctx)}
        </div>
      </div></div></div>`;
  }

  function postPreview(c, client) {
    const imgs = imagesOf(c);
    const i = Math.min(S.slide, Math.max(0, imgs.length - 1));
    const handle = client.handle || String(client.company || "cliente").toLowerCase().replace(/[^a-z0-9]+/g, "");
    const cap = c.caption || "";
    const long = cap.length > 240;
    const shownCap = long && !S.ui.capOpen ? cap.slice(0, 220).replace(/\s+\S*$/, "") + "… " : cap;
    const d = day(c.date);
    return `<article class="post" aria-label="Pré-visualização da publicação">
      <header class="post-head"><span class="avatar"><span>${esc(initials(client.company))}</span></span><span><b>${esc(handle)}</b><small>Pré-visualização · ${esc(c.type || "formato não informado")}</small></span></header>
      <div class="post-media">${mediaHTML(imgSrc(imgs[i]), c.title)}
        ${c.type === "Reel" ? `<span class="reel">${I.reel}Reel</span>` : ""}
        ${imgs.length > 1 ? `<span class="count">${i + 1}/${imgs.length}</span>
          ${i > 0 ? `<button class="nav prev" data-a="slide" data-d="-1" aria-label="Imagem anterior">${I.left}</button>` : ""}
          ${i < imgs.length - 1 ? `<button class="nav next" data-a="slide" data-d="1" aria-label="Próxima imagem">${I.right}</button>` : ""}` : ""}
      </div>
      ${imgs.length > 1 ? `<div class="dots" aria-hidden="true">${imgs.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>` : ""}
      <div class="post-actions" aria-hidden="true">${I.heart}${I.chat}${I.send}<span class="sp"></span>${I.save}</div>
      <div class="post-body">
        ${cap ? `<p class="cap"><b>${esc(handle)}</b>${esc(shownCap)}${long ? `<button class="more" data-a="cap">${S.ui.capOpen ? " ver menos" : "mais"}</button>` : ""}</p>` : `<p class="cap none">Legenda não informada no planejamento.</p>`}
        <p class="when">${d ? "Programado para " + d.long : "Data de publicação não informada"}</p>
      </div>
    </article>`;
  }

  function infoList(c) {
    const d = day(c.date);
    const f = (k, v, cls, full) => `<div class="${full ? "full" : ""}"><dt>${k}</dt><dd class="${v ? cls || "" : "none"}">${v ? esc(v) : "Não informado"}</dd></div>`;
    return `<dl class="info">
      ${f("Data de publicação", d ? d.upper : "", "big")}
      ${f("Tipo de conteúdo", c.type ? c.type.toUpperCase() : "", "big")}
      ${f("Objetivo", c.objective ? c.objective.toUpperCase() : "", "big")}
      <div><dt>Status</dt><dd><span class="status ${esc(c.status)}">${STATUS[c.status]}</span></dd></div>
      ${f("Descrição", c.description, "", true)}
      ${f("Legenda", c.caption, "", true)}
    </dl>`;
  }

  function clientStateCard(ctx) {
    const { c, idx } = ctx;
    const u = S.ui;
    const num = `<span class="n">Conteúdo #${pad(c.order || idx + 1)}</span>`;
    if (c.status === "aprovado") return `<div class="state-card aprovado"><div class="top">${num}<span class="status aprovado">Aprovado</span></div>
      <div class="big-check"><span class="ok">${I.check}</span><div class="msg"><b>Conteúdo aprovado</b><small>Aprovado em ${esc(dt(c.approvedAt)) || "data não registrada"}</small><small>A VA Mídia seguirá com a produção deste conteúdo.</small></div></div>
      ${u.flash === "approved" ? `<div class="success">${I.check}Aprovação registrada. Obrigado!</div>` : ""}</div>`;
    if (c.status === "publicado") return `<div class="state-card publicado"><div class="top">${num}<span class="status publicado">Publicado</span></div>
      <div class="big-check"><span class="ok pub">${I.check}</span><div class="msg"><b>Conteúdo publicado</b>${c.publishedAt ? `<small>Publicado em ${esc(dt(c.publishedAt))}</small>` : ""}</div></div></div>`;
    // em análise
    let body;
    if (u.confirm) body = `<div class="confirm" role="alertdialog" aria-labelledby="cf-t"><p id="cf-t">Aprovar <b>${esc(c.title || "este conteúdo")}</b>? Depois da aprovação, a VA Mídia segue com a produção.</p>
      <div class="actions"><button class="btn btn-primary" data-a="approve-yes" id="cf-yes" ${S.busy.approve ? "disabled" : ""}>${S.busy.approve ? "Registrando…" : "Confirmar aprovação"}</button><button class="btn btn-ghost" data-a="approve-no">Cancelar</button></div></div>`;
    else if (u.change) body = `<div class="composer"><div class="field"><label for="chg-text">O que você gostaria de alterar?</label>
      <textarea class="textarea" id="chg-text" data-draft="chg-${esc(c.id)}" maxlength="2000" placeholder="Ex.: Gostaria de alterar a primeira imagem.">${esc(S.drafts["chg-" + c.id] || "")}</textarea></div>
      ${u.err ? `<div class="form-error" role="alert">${I.alert}<span>${esc(u.err)}</span></div>` : ""}
      <div class="actions"><button class="btn btn-primary" data-a="change-send" ${S.busy.change ? "disabled" : ""}>${S.busy.change ? "Enviando…" : "Enviar solicitação"}</button><button class="btn btn-ghost" data-a="change-cancel">Cancelar</button></div></div>`;
    else body = `<div class="actions"><button class="btn btn-primary" data-a="approve">${I.check}Aprovar conteúdo</button><button class="btn btn-outline" data-a="change">${I.edit}${c.changeRequested ? "Pedir outra alteração" : "Solicitar alteração"}</button></div>`;
    return `<div class="state-card em_analise"><div class="top">${num}<span class="status em_analise">Em análise</span></div>
      ${c.changeRequested ? `<div class="pending-change">${I.edit}<span>Você pediu uma alteração. A VA Mídia está ajustando e responde por aqui. Se preferir, você ainda pode aprovar como está.</span></div>` : `<div class="msg"><b>Aguardando sua aprovação</b><small>Confira a arte, a legenda e a estratégia. Se estiver tudo certo, aprove.</small></div>`}
      ${u.flash === "change" ? `<div class="success">${I.check}Solicitação enviada para a VA Mídia.</div>` : ""}
      ${body}</div>`;
  }

  function adminStatePanel(ctx) {
    const { c } = ctx;
    const pend = S.pendingStatus[c.id];
    const sel = pend || c.status;
    const hist = (c.history || []).slice().reverse().slice(0, 6);
    return `<div class="admin-panel">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap"><h3>Controle da VA Mídia</h3><span class="status ${esc(c.status)}">${STATUS[c.status]}</span></div>
      ${c.changeRequested && c.status === "em_analise" ? `<div class="pending-change">${I.edit}<span>O cliente pediu alteração. Veja o pedido nos comentários abaixo.</span></div>` : ""}
      <div class="field"><span class="label">Status do conteúdo</span>
        <div class="seg" role="group" aria-label="Status">${Object.keys(STATUS).map((k) => `<button class="${k}" data-a="pick-status" data-s="${k}" aria-pressed="${sel === k}">${STATUS[k]}</button>`).join("")}</div></div>

  function lastActivityByClient(a) {
    const m = {};

  }

  function newImport(clientId) {
    const now = new Date();
    return { text: "", files: [], clientId: clientId || "", month: 0, year: now.getFullYear(), parsed: null, rows: null, untouched: [], choices: {}, itemFiles: {}, error: "", busy: false, ai: false, sample: false };
  }
  function impExisting(im) {
    const a = S.adata;
    const p = a.plannings.find((x) => x.clientId === im.clientId && x.month === im.month && x.year === im.year);
    return { planning: p || null, contents: p ? a.contents.filter((c) => c.planningId === p.id) : [] };
  }
  function recomputeMerge() {
    const im = S.imp;
    if (!im.parsed) return;
    const ex = impExisting(im);
    im.parsed.items.forEach((it, i) => { it._attached = resolveItemImages(i, it).files.length > 0; });
    const m = P.planMerge(im.parsed.items, ex.contents);
    im.rows = m.rows; im.untouched = m.untouched;
  }
  function fileFor(name) {
    const n = P.norm(name).replace(/^.*[\\/]/, "");
    return S.imp.files.find((f) => P.norm(f.name) === n) || S.imp.files.find((f) => P.norm(f.name).replace(/\.[a-z0-9]+$/, "") === n.replace(/\.[a-z0-9]+$/, ""));
  }
  const isUrlish = (s) => /^(https?:|data:|blob:|asset:|demo\/)/i.test(s);
  function resolveItemImages(idx, item) {
    const own = S.imp.itemFiles[idx];
    if (own && own.length) return { files: own, urls: [], missing: [] };
    const files = [], urls = [], missing = [];
    item.images.forEach((x) => { if (isUrlish(x)) urls.push(x); else { const f = fileFor(x); if (f) files.push(f); else missing.push(x); } });
    return { files, urls, missing };
  }

      <div class="imp-grid" style="margin-top:22px">${left}${right}</div>${preview}`;
  }
  const urlCache = new WeakMap();
  function fileURL(f) { if (!urlCache.has(f)) urlCache.set(f, URL.createObjectURL(f)); return urlCache.get(f); }
  function previewRow(r, i) {
    const it = r.item;
    const res = resolveItemImages(i, it);
    const thumb = res.files[0] ? fileURL(res.files[0]) : res.urls[0] ? imgSrc(res.urls[0]) : (r.match && imagesOf(r.match)[0] ? imgSrc(imagesOf(r.match)[0]) : "");
    const d = day(it.date);
    const warns = it.warnings.filter((w) => !(w === "Sem imagem" && (res.files.length || (r.match && imagesOf(r.match).length))) && !(w === "Imagem citada, mas não anexada" && res.files.length)).map((w) => `<span class="tag warn">${esc(w)}</span>`);
    res.missing.forEach((m) => warns.push(`<span class="tag warn">Arquivo “${esc(m)}” não anexado</span>`));
    const labels = { create: "Novo", update: "Atualiza", same: "Sem mudança", conflict: "Decidir", ambiguous: "Decidir" };
    const ch = S.imp.choices[i];
    let choice = "";
    if (r.action === "conflict") choice = `<div class="choice"><span>${esc(r.reason)} Mudanças: ${r.changes.map((x) => P.FIELD_LABELS[x]).join(", ")}.</span>
      <label><input type="radio" name="ch-${i}" data-a-change="imp-choice" data-i="${i}" value="keep" ${ch !== "apply" ? "checked" : ""}> Manter o conteúdo atual (recomendado)</label>
      <label><input type="radio" name="ch-${i}" data-a-change="imp-choice" data-i="${i}" value="apply" ${ch === "apply" ? "checked" : ""}> Aplicar mudanças${r.match.status === "aprovado" ? " e voltar para Em análise (o cliente aprova de novo)" : " (continua Publicado)"}</label></div>`;
    if (r.action === "ambiguous") choice = `<div class="choice"><span>${esc(r.reason)}</span>
      <label><input type="radio" name="ch-${i}" data-a-change="imp-choice" data-i="${i}" value="skip" ${ch !== "create" ? "checked" : ""}> Não importar este item</label>
      <label><input type="radio" name="ch-${i}" data-a-change="imp-choice" data-i="${i}" value="create" ${ch === "create" ? "checked" : ""}> Criar como conteúdo novo</label></div>`;
    return `<div class="pv ${r.action}" style="animation-delay:${Math.min(i, 10) * 30}ms">
      <div class="th">${thumb ? `<img src="${esc(thumb)}" alt="" data-fallback>` : `<span class="noimg">${I.image}<span>Sem imagem</span></span>`}</div>
      <div class="bd"><b>${esc(it.title || "Título não informado")}</b>
        <span class="ln"><span class="when" style="font-family:var(--f-mono)">${d ? d.full : "SEM DATA"}</span>·<span>${esc(it.type || "Tipo não informado")}</span>${it.objective ? `·<span>${esc(it.objective)}</span>` : ""}${it.status ? `<span class="status ${it.status}">${STATUS[it.status]}</span>` : ""}</span>
        ${it.caption ? `<span class="cap">${esc(it.caption)}</span>` : ""}
        ${r.action === "update" ? `<span class="ln">Campos alterados: ${r.changes.map((x) => P.FIELD_LABELS[x]).join(", ")}. Status, aprovação e comentários são preservados.</span>` : ""}
        ${warns.length ? `<span class="warns">${warns.join("")}</span>` : ""}
        ${choice}
      </div>
      <div class="ops"><span class="act-tag ${r.action}">${labels[r.action]}</span>
        ${r.action !== "same" && S.info.canUploadImages ? `<label class="btn btn-ghost btn-sm" for="pv-f-${i}">${I.image}Imagem</label><input id="pv-f-${i}" type="file" accept="image/*" multiple class="sr" data-a-change="imp-item-file" data-i="${i}">` : ""}</div>
    </div>`;
  }
