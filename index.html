  }

  /* ---------------- v4 · páginas: visão geral (feed), stories, destaques, central ---------------- */
  const TYPE_NAME = (t) => (t === "Publi" ? "Influenciador" : t || "Conteúdo");
  const NAV = [["home", "Visão geral"], ["stories", "Stories"], ["destaques", "Destaques"], ["central", "Central de conteúdos"], ["cal", "Calendário"], ["dash", "Painel da semana"], ["reports", "Relatórios"], ["traffic", "Tráfego pago"]];
  function navHTML() {
    return `<nav class="topnav" aria-label="Navegação do portal"><div class="topnav-in" id="topnav">${NAV.map(([k, l], i) => `${i === 4 ? '<span class="nav-sep" aria-hidden="true"></span>' : ""}<button class="nbtn" data-a="ctab" data-t="${k}" ${S.ctab === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}<span class="nav-pill" aria-hidden="true"></span></div></nav>`;
  }
  function weekGroups(list, planning) {
    const [ra, rb] = planRange(planning, list);
    const thisMon = mondayOf(new Date()).getTime(), nextMon = thisMon + 7 * 864e5;
    const out = []; let n = 0;
    for (let mon = mondayOf(ra); mon <= rb; mon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7)) {
      n++;
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      const a = ymd(mon), b = ymd(sun);
      const items = list.filter((c) => c.date && c.date >= a && c.date <= b);
      if (!items.length) continue;
      const t = mon.getTime();
      out.push({ n, mon, sun, items, tag: t === thisMon ? "Esta semana" : t === nextMon ? "Próxima semana" : "", past: sun.getTime() < thisMon });
    }
    return out;
  }
  const rangeLabel = (a, b) => `${pad(a.getDate())}${a.getMonth() !== b.getMonth() ? " " + MES3[a.getMonth()] : ""} a ${pad(b.getDate())} ${MES3[b.getMonth()]}`;
  function weekHead(g) {
    const pend = g.items.filter((c) => c.status === "em_analise").length;
    return `<header class="wkh rv"><div><span class="wkh-k">Semana ${g.n} · ${rangeLabel(g.mon, g.sun)}</span>${g.tag ? `<span class="wk-tag ${g.tag === "Esta semana" ? "now" : "next"}">${g.tag}</span>` : ""}</div>
      <div class="wkh-n"><b data-count="${g.items.length}">${pad(g.items.length)}</b><span>${g.items.length === 1 ? "conteúdo" : "conteúdos"}${pend ? ` · ${pend} em análise` : ""}</span></div></header>`;
  }
  function ccard(c, scope, i) {
    const img = imgSrc(imagesOf(c)[0]);
    const d = c.date ? new Date(c.date + "T12:00:00") : null;
    const story = kindOf(c) === "story";
    return `<button class="ccard rv tilt${story ? " is-story" : ""}" data-a="open" data-id="${esc(c.id)}" ${scope ? `data-scope="${scope}"` : ""} style="--d:${Math.min(i, 8) * 45}ms" aria-label="${esc(TYPE_NAME(c.type) + ": " + (c.title || "sem título") + ", " + STATUS[c.status])}">
      <span class="cc-media">${img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : mockHTML(c)}<span class="cc-st ${esc(c.status)}"><i></i>${STATUS[c.status]}</span></span>
      <span class="cc-body"><span class="cc-top">${typeIcon(c.type)}<span>${esc(TYPE_NAME(c.type))}</span><span class="cc-date">${d ? `${WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : "Sem data"}</span></span>
      <b class="${c.title ? "" : "none"}">${esc(c.title || "Título não informado")}</b>
      ${c.changeRequested && c.status === "em_analise" ? '<span class="tag change">Ajuste pedido</span>' : ""}</span>
    </button>`;
  }
  function weeksCards(list, planning, scope) {
    const groups = weekGroups(list, planning);
    const undated = list.filter((c) => !c.date);
    let html = groups.map((g) => `<section class="wsec${g.past ? " past" : ""}">${weekHead(g)}<div class="cgrid">${g.items.map((c, i) => ccard(c, scope, i)).join("")}</div></section>`).join("");
    if (undated.length) html += `<section class="wsec"><header class="wkh rv"><div><span class="wkh-k">${undated.every((c) => kindOf(c) === "destaque") ? "Destaques do perfil" : "Sem data definida"}</span></div><div class="wkh-n"><b>${pad(undated.length)}</b><span>${undated.length === 1 ? "conteúdo" : "conteúdos"}</span></div></header><div class="cgrid">${undated.map((c, i) => ccard(c, scope, i)).join("")}</div></section>`;
    return html || `<div class="empty">${I.inbox}<b>Nada por aqui</b><span>Nenhum conteúdo para mostrar com este filtro.</span></div>`;
  }
  function profileHead(client, all) {
    const posts = all.filter((c) => kindOf(c) === "feed").length, st = all.filter((c) => kindOf(c) === "story").length, hl = all.filter((c) => kindOf(c) === "destaque").length;
    return `<div class="ig-head rv"><span class="avatar big">${avatarInner(client)}</span><div class="ig-id"><b>${esc(handleOf(client))}</b><span class="muted">${esc(client.company)}</span><span class="ig-count"><b data-count="${posts}">${posts}</b> posts <b data-count="${st}">${st}</b> stories <b data-count="${hl}">${hl}</b> destaques</span></div></div>`;
  }
  function homeTab(all, client, isAdmin) {
    const c = counts(all);
    const pending = all.filter((x) => x.status === "em_analise" && !x.changeRequested);
    const changes = all.filter((x) => x.status === "em_analise" && x.changeRequested);
    let note = "";
    if (!isAdmin && pending.length) note = `<div class="slim rv"><span class="pulse"></span><span class="slim-t"><b>${pending.length === 1 ? "1 conteúdo aguarda" : pending.length + " conteúdos aguardam"} sua aprovação.</b>${changes.length ? ` <span class="muted">${changes.length === 1 ? "1 ajuste está" : changes.length + " ajustes estão"} com a VA Mídia.</span>` : ""}</span><button class="btn btn-primary btn-sm" data-a="open" data-id="${esc(pending[0].id)}">Revisar</button></div>`;
    else if (isAdmin && c.change) note = `<div class="slim warn rv"><span class="okdot">${I.edit}</span><span class="slim-t"><b>${c.change === 1 ? "1 alteração pedida" : c.change + " alterações pedidas"} pelo cliente.</b></span></div>`;
    const feed = all.filter((x) => kindOf(x) === "feed" && (S.filter === "all" || x.status === S.filter)).sort((a, b) => byDate(b, a));
    const grid = feed.map((x, i) => {
      const img = imgSrc(imagesOf(x)[0]);
      return `<button class="ig-tile rv" style="--d:${Math.min(i, 9) * 35}ms" data-a="open" data-id="${esc(x.id)}" data-scope="feed" aria-label="${esc(TYPE_NAME(x.type) + ": " + (x.title || "") + ", " + STATUS[x.status])}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : mockHTML(x)}${x.type === "Reel" || x.type === "Carrossel" || x.type === "Publi" ? `<span class="ig-fmt">${typeIcon(x.type)}</span>` : ""}<span class="ig-st ${esc(x.status)}" title="${STATUS[x.status]}"></span><span class="ig-hover"><b>${esc(x.title || "")}</b><span>${STATUS[x.status]}</span></span></button>`;
    }).join("");
    return `${note}${summaryBar(c)}<div class="ig home">${profileHead(client, all)}
      <div class="ig-sec"><div class="ig-label">Feed <span class="muted">· posts, reels, carrosséis e influenciadores · toque para avaliar</span></div>${grid ? `<div class="ig-grid">${grid}</div>` : `<p class="wk-empty">Nenhum post de feed${S.filter !== "all" ? " com este status" : ""} neste mês.</p>`}</div></div>`;
  }
  function storiesTab(all, planning) {
    const stories = all.filter((c) => kindOf(c) === "story");
    const groups = {}; stories.forEach((c) => { const k = c.date || "~"; (groups[k] = groups[k] || []).push(c); });
    const rings = Object.keys(groups).sort().map((k) => {
      const g = groups[k], d = day(g[0].date), img = imgSrc(imagesOf(g[0])[0]);
      return ringHTML(g[0], groupStatus(g), (d ? d.short : "Sem data") + (g.length > 1 ? ` · ${g.length}` : ""), "story", img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : `<span class="ring-txt">${d ? `<b>${d.short.slice(0, 2)}</b>${d.short.slice(3)}` : "—"}</span>`);
    }).join("");
    if (!stories.length) return `<div class="empty">${I.story}<b>Nenhum story neste planejamento</b></div>`;
    return `<div class="page-h rv"><h2>Stories</h2><span class="muted"><b data-count="${stories.length}">${stories.length}</b> stories em ${Object.keys(groups).length} dias</span></div>
      <div class="rings big rv">${rings}</div>${weeksCards(stories, planning, "story")}`;
  }
  function destaquesTab(all, client) {
    const hls = all.filter((c) => kindOf(c) === "destaque");
    if (!hls.length) return `<div class="empty">${I.highlight}<b>Nenhum destaque neste planejamento</b></div>`;
    return `<div class="page-h rv"><h2>Destaques do perfil</h2><span class="muted"><b data-count="${hls.length}">${hls.length}</b> destaques sugeridos</span></div>
      <div class="ig hl-page">${profileHead(client, all)}<div class="rings big rv">${hls.map((c) => { const img = imgSrc(imagesOf(c)[0]); return ringHTML(c, c.status, c.title || "Destaque", "destaque", img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : `<span class="ring-ic">${I.highlight}</span>`); }).join("")}</div></div>
      <div class="cgrid hl">${hls.map((c, i) => ccard(c, "destaque", i)).join("")}</div>`;
  }
  const CENTRAL_FILTERS = [["all", "Todos"], ["Reel", "Reels"], ["Carrossel", "Carrossel"], ["Post", "Posts"], ["Publi", "Influenciador"], ["Story", "Stories"], ["Destaque", "Destaques"]];
  function centralTab(all, planning, key) {
    const fkey = "central-" + key, cur = S.tf[fkey] || "all";
    const chips = CENTRAL_FILTERS.map(([k, l]) => { const n = all.filter((c) => matchType(c, k)).length; if (!n && k !== "all" && cur !== k) return ""; return `<button class="fbtn" data-a="tfilter" data-key="${esc(fkey)}" data-f="${k}" aria-pressed="${cur === k}"><span>${l}</span><b data-count="${n}">${n}</b></button>`; }).join("");
    const list = all.filter((c) => matchType(c, cur));
    return `<div class="fbar rv" role="group" aria-label="Tipo de conteúdo">${chips}</div>${weeksCards(list, planning, null)}`;
  }

  /* ---------------- movimento: revelar ao rolar, contadores, inclinação, brilho ---------------- */
  const reduce = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let revealObs = null;
  function motion() {
    if (reduce()) return;
    if (!revealObs && "IntersectionObserver" in window) revealObs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.remove("pre"); revealObs.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
    const vh = innerHeight;
    document.querySelectorAll("#app .rv:not(.seen)").forEach((el) => {
      el.classList.add("seen");
      const r = el.getBoundingClientRect();
      if (revealObs && r.top > vh * 0.92) { el.classList.add("pre"); revealObs.observe(el); }
    });
    // contadores (só na primeira vez que a página aparece)
    const key = S.view + "|" + S.ctab + "|" + (S.adminClientId || "");
    if (key !== S.countKey) {
      S.countKey = key;
      document.querySelectorAll("#app [data-count]").forEach((el) => {
        const to = +el.dataset.count; if (!(to > 1)) return;
        const padded = el.textContent.length === 2 && to < 10 || /^0/.test(el.textContent);
        const t0 = performance.now(), dur = 700;
        const step = (t) => { const k = Math.min(1, (t - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = padded ? pad(v) : v; if (k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      });
    }
    // indicador deslizante do menu
    const nav = document.getElementById("topnav");
    if (nav) {
      const act = nav.querySelector('[aria-current="page"]'), pill = nav.querySelector(".nav-pill");
      if (act && pill) {
        if (S.pillPos) { pill.style.transition = "none"; pill.style.transform = `translateX(${S.pillPos[0]}px)`; pill.style.width = S.pillPos[1] + "px"; pill.offsetWidth; pill.style.transition = ""; }
        pill.style.transform = `translateX(${act.offsetLeft}px)`; pill.style.width = act.offsetWidth + "px";
        S.pillPos = [act.offsetLeft, act.offsetWidth];
        if (act.offsetLeft < nav.scrollLeft || act.offsetLeft + act.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = act.offsetLeft - 16;
      }
    }
  }
  let rafP = 0;
  document.addEventListener("pointermove", (e) => {
    if (reduce() || e.pointerType === "touch") return;
    if (rafP) return;
    rafP = requestAnimationFrame(() => {
      rafP = 0;
      document.documentElement.style.setProperty("--mx", e.clientX + "px");
      document.documentElement.style.setProperty("--my", e.clientY + "px");
      const t = e.target.closest && e.target.closest(".tilt");
      document.querySelectorAll(".tilt.tilting").forEach((x) => { if (x !== t) { x.classList.remove("tilting"); x.style.removeProperty("--rx"); x.style.removeProperty("--ry"); } });
      if (t) { const r = t.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5; t.classList.add("tilting"); t.style.setProperty("--rx", (-py * 6).toFixed(2) + "deg"); t.style.setProperty("--ry", (px * 8).toFixed(2) + "deg"); t.style.setProperty("--gx", ((px + 0.5) * 100).toFixed(1) + "%"); t.style.setProperty("--gy", ((py + 0.5) * 100).toFixed(1) + "%"); }
    });
  }, { passive: true });

  /* ---------------- área do cliente (abas) ---------------- */
  function clientTabs() {
    const t = (k, l) => `<button class="ctab" data-a="ctab" data-t="${k}" ${S.ctab === k ? 'aria-current="page"' : ""}>${l}</button>`;
    return `<nav class="ctabs" aria-label="Seções">${t("overview", "Visão geral")}${t("feed", "Conteúdos")}${t("dash", "Painel da semana")}${t("reports", "Relatórios")}${t("traffic", "Tráfego pago")}</nav>`;
  }
  function clientWorkspace(data, client, isAdmin, key) {
    const plannings = planningsFor(data, client.id);
    const planning = pickPlanning(data, client.id, key);
    const all = planning ? data.contents.filter((c) => c.planningId === planning.id).sort(byDate) : [];
    if (!NAV.some(([k]) => k === S.ctab)) S.ctab = "home";
    let body;
    if (S.ctab === "reports") body = reportsView(data, client, isAdmin);
    else if (S.ctab === "traffic") body = trafficView(data, client, isAdmin);
    else if (S.ctab === "dash") body = dashboardHTML(data.contents.filter((c) => c.clientId === client.id), { isAdmin, key: "dash-" + client.id });
    else if (!planning) body = `<div class="empty">${I.inbox}<b>${isAdmin ? "Nenhum planejamento para este cliente" : "Seu planejamento ainda não foi publicado"}</b><span>${isAdmin ? "Cole o planejamento do mês na aba Importar e o portal monta tudo." : "Quando a VA Mídia publicar o planejamento do mês, ele aparece aqui."}</span></div>`;
    else if (S.ctab === "stories") body = storiesTab(all, planning);
    else if (S.ctab === "destaques") body = destaquesTab(all, client);
    else if (S.ctab === "central") body = centralTab(all, planning, key);
    else if (S.ctab === "cal") body = overviewTab(all, planning, isAdmin);
    else body = homeTab(all, client, isAdmin);
    const months = !["reports", "traffic", "dash"].includes(S.ctab) && planning ? monthChips(plannings, planning, key) : "";
    return { planning, nav: navHTML(), html: `${months ? `<div class="months-row">${months}</div>` : ""}<div class="ctab-body">${body}</div>` };
  }

  function overviewTab(all, planning, isAdmin) {
    const c = counts(all);
    const list = S.filter === "all" ? all : all.filter((x) => x.status === S.filter);
    const pending = all.filter((x) => x.status === "em_analise" && !x.changeRequested);
    const changes = all.filter((x) => x.status === "em_analise" && x.changeRequested);
    let note = "";
    if (!isAdmin && pending.length) note = `<div class="slim"><span class="pulse"></span><span class="slim-t"><b>${pending.length === 1 ? "1 conteúdo aguarda" : pending.length + " conteúdos aguardam"} sua aprovação.</b>${changes.length ? ` <span class="muted">${changes.length === 1 ? "1 ajuste está" : changes.length + " ajustes estão"} com a VA Mídia.</span>` : ""}</span><button class="btn btn-primary btn-sm" data-a="open" data-id="${esc(pending[0].id)}">Revisar</button></div>`;
    else if (!isAdmin && !changes.length) note = `<div class="slim calm"><span class="okdot">${I.check}</span><span class="slim-t"><b>Tudo em dia.</b> <span class="muted">Nenhum conteúdo aguardando você neste mês.</span></span></div>`;
    else if (isAdmin && c.change) note = `<div class="slim warn"><span class="okdot">${I.edit}</span><span class="slim-t"><b>${c.change === 1 ? "1 alteração pedida" : c.change + " alterações pedidas"} pelo cliente.</b> <span class="muted">Abra o conteúdo para ler e responder.</span></span></div>`;
    return `${note}${summaryBar(c)}
      <section class="block"><div class="block-h"><h2>Calendário</h2><span class="legend"><i class="em_analise"></i>Em análise<i class="aprovado"></i>Aprovado<i class="em_execucao"></i>Em execução<i class="publicado"></i>Publicado</span></div>${calendarHTML(planning, list)}</section>
      <section class="block"><div class="block-h"><h2>Semana a semana</h2></div>${weeksHTML(planning, list)}</section>`;
  }

  // período do planejamento: o mês inteiro + datas que passam dele (ex.: 12/10 a 08/11)
  function planRange(planning, list) {
    let a = new Date(planning.year, planning.month - 1, 1), b = new Date(planning.year, planning.month, 0);
    list.forEach((c) => { if (!c.date) return; const d = new Date(c.date + "T12:00:00"); if (d < a) a = new Date(d.getFullYear(), d.getMonth(), d.getDate()); if (d > b) b = new Date(d.getFullYear(), d.getMonth(), d.getDate()); });
    return [a, b];
  }
  const undatedOf = (list) => list.filter((c) => !c.date && kindOf(c) !== "destaque");
  function calendarHTML(planning, list) {
    const [ra, rb] = planRange(planning, list);
    const today = ymd(new Date());
    const byDay = {}; list.forEach((c) => { if (c.date) (byDay[c.date] = byDay[c.date] || []).push(c); });
    let cells = "";
    const startD = mondayOf(ra), endD = new Date(rb.getFullYear(), rb.getMonth(), rb.getDate() + ((7 - ((rb.getDay() + 6) % 7)) % 7) + 0);
    const lastSun = new Date(mondayOf(rb).getFullYear(), mondayOf(rb).getMonth(), mondayOf(rb).getDate() + 6);
    for (let d = new Date(startD); d <= lastSun; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      const k = ymd(d), items = byDay[k] || [];
      const inMonth = d.getMonth() === planning.month - 1 && d.getFullYear() === planning.year;
      const label = d.getDate() === 1 || +d === +startD ? `${d.getDate()} ${MES3[d.getMonth()].toLowerCase()}` : d.getDate();
      cells += `<div class="cal-cell${inMonth ? "" : " other"}${k === today ? " today" : ""}${items.length ? " has" : ""}"><span class="cal-d">${label}</span>${items.map((c) => `<button class="cal-chip ${esc(c.status)}" data-a="open" data-id="${esc(c.id)}" title="${esc((c.type || "Conteúdo") + " · " + (c.title || "") + " · " + STATUS[c.status])}" aria-label="${esc((c.type || "Conteúdo") + ": " + (c.title || "sem título") + ", " + STATUS[c.status])}"><i></i>${typeIcon(c.type)}<span>${esc(c.title || c.type || "Conteúdo")}</span></button>`).join("")}</div>`;
    }
    void endD;
    const undated = undatedOf(list).length;
    const hls = list.filter((c) => !c.date && kindOf(c) === "destaque").length;
    return `<div class="cal"><div class="cal-head">${["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map((w) => `<span>${w}</span>`).join("")}</div><div class="cal-grid">${cells}</div></div>
      ${undated ? `<p class="hint" style="margin-top:10px">${undated === 1 ? "1 conteúdo sem data definida" : undated + " conteúdos sem data definida"}: veja na lista semana a semana.</p>` : ""}
      ${hls ? `<p class="hint" style="margin-top:6px">${hls === 1 ? "1 destaque do perfil" : hls + " destaques do perfil"} (sem data de postagem): veja no fim da lista e na aba Conteúdos.</p>` : ""}`;
  }

  function weekRow(c) {
    const d = c.date ? new Date(c.date + "T12:00:00") : null;
    return `<button class="wk-row" data-a="open" data-id="${esc(c.id)}">
      <span class="wk-d">${d ? `<b>${pad(d.getDate())}</b>${WD[d.getDay()]}` : "<b>—</b>s/ data"}</span>
      <span class="wk-type">${typeIcon(c.type)}<span>${esc(c.type || "Tipo?")}</span></span>
      <span class="wk-title${c.title ? "" : " none"}">${esc(c.title || "Título não informado")}${c.changeRequested && c.status === "em_analise" ? ' <span class="tag change">Ajuste pedido</span>' : ""}</span>
      <span class="status ${esc(c.status)}">${STATUS[c.status]}</span></button>`;
  }
  function weeksHTML(planning, list) {
    const [first, last] = planRange(planning, list);
    const thisMon = mondayOf(new Date()).getTime(), nextMon = thisMon + 7 * 864e5;
    let out = "", n = 0;
    for (let mon = mondayOf(first); mon <= last; mon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7)) {
      n++;
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      const a = ymd(mon), b = ymd(sun);
      const items = list.filter((c) => c.date && c.date >= a && c.date <= b);
      const t = mon.getTime();
      const tag = t === thisMon ? '<span class="wk-tag now">Esta semana</span>' : t === nextMon ? '<span class="wk-tag next">Próxima semana</span>' : "";
      const past = sun.getTime() < thisMon;
      const pend = items.filter((c) => c.status === "em_analise").length;
      out += `<div class="wk${past ? " past" : ""}${t === thisMon || t === nextMon ? " hot" : ""}">
        <div class="wk-h"><b>Semana ${n}</b><span class="muted">${pad(mon.getDate())}/${pad(mon.getMonth() + 1)} – ${pad(sun.getDate())}/${pad(sun.getMonth() + 1)}</span>${tag}<span class="spacer"></span><span class="muted wk-c">${items.length ? `${items.length} ${items.length === 1 ? "conteúdo" : "conteúdos"}${pend ? ` · ${pend} em análise` : ""}` : ""}</span></div>
        ${items.length ? `<div class="wk-list">${items.map(weekRow).join("")}</div>` : `<p class="wk-empty">Nada programado.</p>`}
      </div>`;
    }
    const undated = undatedOf(list);
    if (undated.length) out += `<div class="wk"><div class="wk-h"><b>Sem data definida</b></div><div class="wk-list">${undated.map(weekRow).join("")}</div></div>`;
    const hls = list.filter((c) => !c.date && kindOf(c) === "destaque");
    if (hls.length) out += `<div class="wk"><div class="wk-h"><b>Destaques do perfil</b><span class="muted">ficam fixos no perfil, sem data de postagem</span></div><div class="wk-list">${hls.map(weekRow).join("")}</div></div>`;
    return `<div class="weeks">${out}</div>`;
  }

  function ringHTML(c, status, label, scope, inner) {
    return `<button class="ring-btn" data-a="open" data-id="${esc(c.id)}" data-scope="${scope}" aria-label="${esc(label + ", " + STATUS[status])}">
      <span class="ring ${status}"><span class="ring-in">${inner}</span></span><span class="ring-l">${esc(label)}</span></button>`;
  }
  function feedTab(allIn, client, wkey) {
    const fkey = "feed-" + wkey;
    const f = S.tf[fkey] || "all";
    const chips = typeChips(fkey, allIn);
    const all = allIn.filter((c) => matchType(c, f));
    const posts = all.filter((c) => kindOf(c) === "feed").sort((a, b) => byDate(b, a));
    const stories = all.filter((c) => kindOf(c) === "story");
    const hls = all.filter((c) => kindOf(c) === "destaque");
    const groups = {}; stories.forEach((c) => { const k = c.date || "sem-data"; (groups[k] = groups[k] || []).push(c); });
    const storyRow = Object.keys(groups).sort().map((k) => {
      const g = groups[k], d = day(g[0].date), img = imgSrc(imagesOf(g[0])[0]);
      const inner = img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : `<span class="ring-txt">${d ? `<b>${d.short.slice(0, 2)}</b>${d.short.slice(3)}` : "—"}</span>`;
      return ringHTML(g[0], groupStatus(g), (d ? d.short : "Sem data") + (g.length > 1 ? ` · ${g.length}` : ""), "story", inner);
    }).join("");
    const hlRow = hls.map((c) => {
      const img = imgSrc(imagesOf(c)[0]);
      return ringHTML(c, c.status, c.title || "Destaque", "destaque", img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : `<span class="ring-ic">${I.story}</span>`);
    }).join("");
    const grid = posts.map((c) => {
      const img = imgSrc(imagesOf(c)[0]);
      return `<button class="ig-tile" data-a="open" data-id="${esc(c.id)}" data-scope="feed" aria-label="${esc((c.type || "Post") + ": " + (c.title || "") + ", " + STATUS[c.status])}">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : mockHTML(c)}
        ${c.type === "Reel" || c.type === "Carrossel" ? `<span class="ig-fmt">${typeIcon(c.type)}</span>` : ""}<span class="ig-st ${esc(c.status)}" title="${STATUS[c.status]}"></span></button>`;
    }).join("");
    const storyCards = stories.map((c) => {
      const img = imgSrc(imagesOf(c)[0]); const d = day(c.date);
      return `<button class="ig-tile story-t" data-a="open" data-id="${esc(c.id)}" data-scope="story" aria-label="${esc("Story: " + (c.title || "") + ", " + STATUS[c.status])}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fallback>` : mockHTML(c)}<span class="ig-date">${d ? d.short : "S/ DATA"}</span><span class="ig-st ${esc(c.status)}"></span></button>`;
    }).join("");
    const head = `<div class="ig-head"><span class="avatar big">${avatarInner(client)}</span>`;
    const sec = (label, inner, empty) => `<div class="ig-sec"><div class="ig-label">${label}</div>${inner || `<p class="wk-empty">${empty}</p>`}</div>`;
    let body;
    if (f === "all") body = sec('Stories <span class="muted">· toque para ver</span>', storyRow && `<div class="rings">${storyRow}</div>`, "Nenhum story neste mês.") + sec("Destaques", hlRow && `<div class="rings">${hlRow}</div>`, "Nenhum destaque sugerido neste mês.") + sec("Feed", grid && `<div class="ig-grid">${grid}</div>`, "Nenhum post de feed neste mês.");
    else if (f === "Story") body = sec("Stories", storyCards && `<div class="ig-grid stories">${storyCards}</div>`, "Nenhum story neste mês.");
    else if (f === "Destaque") body = sec("Destaques", hlRow && `<div class="rings">${hlRow}</div>`, "Nenhum destaque sugerido neste mês.");
    else body = sec(TYPE_FILTERS.find((x) => x[0] === f)[1], grid && `<div class="ig-grid">${grid}</div>`, "Nenhum conteúdo deste tipo neste mês.");
    return `${chips}<div class="ig">
      ${head}<div class="ig-id"><b>${esc(handleOf(client))}</b><span class="muted">${esc(client.company)}</span><span class="ig-count"><b>${posts.length}</b> posts <b>${stories.length}</b> stories <b>${hls.length}</b> destaques</span></div></div>
      ${body}
    </div>`;
  }

  /* ---------------- prévias de story e destaque ---------------- */
  function storyFrame(c, client) {
    const imgs = imagesOf(c);
    const i = Math.min(S.slide, Math.max(0, imgs.length - 1));
    const src = imgSrc(imgs[i]);
    const d = day(c.date);
    return `<div class="story-frame">
      ${src ? `<img src="${esc(src)}" alt="${esc(c.title || "")}" data-fallback>` : `<div class="story-mock"><span class="tag">Prévia · arte em produção</span><h3>${esc(c.title || "Story")}</h3>${c.description ? `<p>${esc(c.description)}</p>` : ""}</div>`}
      <div class="story-top"><div class="story-bars">${(imgs.length > 1 ? imgs : [0]).map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
        <div class="story-user"><span class="avatar sm">${avatarInner(client)}</span><b>${esc(handleOf(client))}</b><small>${d ? d.short : ""}</small></div></div>
      ${imgs.length > 1 ? `${i > 0 ? `<button class="nav prev" data-a="slide" data-d="-1" aria-label="Anterior">${I.left}</button>` : ""}${i < imgs.length - 1 ? `<button class="nav next" data-a="slide" data-d="1" aria-label="Próxima">${I.right}</button>` : ""}` : ""}
    </div>`;
  }
  function storyPreview(c, client) {
    return `<article class="story" aria-label="Pré-visualização do story">${storyFrame(c, client)}
      ${c.caption ? `<p class="story-cap"><span class="label">Texto do story</span>${esc(c.caption)}</p>` : ""}</article>`;
  }
  function highlightPreview(c, client) {
    const img = imgSrc(imagesOf(c)[0]);
    return `<article class="story" aria-label="Pré-visualização do destaque">
      <div class="hl-top"><span class="ring ${esc(c.status)} lg"><span class="ring-in">${img ? `<img src="${esc(img)}" alt="" data-fallback>` : `<span class="ring-ic">${I.story}</span>`}</span></span><b>${esc(c.title || "Destaque")}</b><small class="muted">Destaque sugerido no perfil</small></div>
      ${storyFrame(c, client)}</article>`;
  }

  /* ---------------- relatórios ---------------- */
  function monthOptions(sel) { return MES.map((m, i) => `<option value="${i + 1}" ${sel === i + 1 ? "selected" : ""}>${m.replace(/^\w/, (x) => x.toUpperCase())}</option>`).join(""); }
  function reportsView(data, client, isAdmin) {
    const list = (data.reports || []).filter((r) => r.clientId === client.id).sort((a, b) => b.year - a.year || b.month - a.month || String(b.createdAt).localeCompare(String(a.createdAt)));
    let form = "";
    if (isAdmin) {
      const f = S.rform;
      form = f && f.clientId === client.id ? `<form class="card form-card" data-form="report" novalidate><h3>Novo relatório</h3>
        <div class="grid2"><div class="field"><label for="rp-month">Mês</label><select class="select" id="rp-month" data-bind="rform.month" data-num>${monthOptions(f.month)}</select></div>
        <div class="field"><label for="rp-year">Ano</label><input class="input" id="rp-year" type="number" data-bind="rform.year" data-num value="${esc(f.year)}"></div></div>
        <div class="field"><label for="rp-title">Título</label><input class="input" id="rp-title" data-bind="rform.title" value="${esc(f.title)}" placeholder="Relatório de resultados · Outubro"></div>
        <div class="field"><label for="rp-sum">Resumo para o cliente</label><textarea class="textarea" id="rp-sum" data-bind="rform.summary" placeholder="Principais números e destaques do mês.">${esc(f.summary)}</textarea></div>
        <div class="field"><label for="rp-url">Link do relatório (Canva, Drive, Looker…)</label><input class="input" id="rp-url" type="url" data-bind="rform.url" value="${esc(f.url)}" placeholder="https://"></div>
        ${S.info.canUploadImages ? `<div class="field"><span class="label">Ou envie o arquivo (PDF)</span><div class="row"><label class="btn btn-sm" for="rp-file">${I.upload}Escolher arquivo</label><input id="rp-file" type="file" accept="application/pdf,image/*" class="sr" data-a-change="rp-file"><span class="hint">${f.file ? esc(f.file.name) : "Nenhum arquivo"}</span></div></div>` : ""}
        ${f.error ? `<div class="form-error" role="alert">${I.alert}<span>${esc(f.error)}</span></div>` : ""}
        <div class="row"><button class="btn btn-primary" type="submit" ${S.busy.report ? "disabled" : ""}>${S.busy.report ? "Publicando…" : "Publicar relatório"}</button><button type="button" class="btn btn-ghost" data-a="rp-cancel">Cancelar</button></div></form>`
        : `<div class="row" style="margin-bottom:16px"><button class="btn btn-primary btn-sm" data-a="rp-new" data-id="${esc(client.id)}">Adicionar relatório</button></div>`;
    }
    const cards = list.length ? `<div class="rep-list">${list.map((r) => `<article class="rep">
        <div class="rep-h"><span class="label">${monthName(r.month, r.year)}</span>${isAdmin ? (S.ui["rpdel-" + r.id] ? `<span class="row"><button class="btn btn-danger btn-sm" data-a="rp-del-yes" data-id="${esc(r.id)}">Excluir</button><button class="btn btn-ghost btn-sm" data-a="rp-del-no" data-id="${esc(r.id)}">Cancelar</button></span>` : `<button class="btn btn-ghost btn-sm" data-a="rp-del" data-id="${esc(r.id)}">${I.trash}</button>`) : ""}</div>
        <h3>${esc(r.title || "Relatório do mês")}</h3>${r.summary ? `<p class="rep-s">${esc(r.summary)}</p>` : ""}
        <div class="row" style="flex-wrap:wrap">${safeUrl(r.url) ? `<a class="btn btn-primary btn-sm" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Abrir relatório ${I.arrow}</a>` : ""}${r.fileUrl ? `<a class="btn btn-sm" href="${esc(imgSrc(r.fileUrl))}" target="_blank" rel="noopener">Ver arquivo</a>` : ""}</div>
      </article>`).join("")}</div>` : `<div class="empty">${I.inbox}<b>Nenhum relatório ainda</b><span>${isAdmin ? "Adicione o primeiro relatório deste cliente." : "Quando a VA Mídia publicar o relatório do mês, ele aparece aqui."}</span></div>`;
    return form + cards;
  }

  /* ---------------- tráfego pago ---------------- */
  const TRAFFIC_FIELDS = [["budget", "Verba"], ["period", "Período"], ["objective", "Objetivo"], ["audience", "Público"], ["campaigns", "Campanhas previstas"], ["notes", "Observações"]];
  function trafficView(data, client, isAdmin) {
    const list = (data.traffic || []).filter((t) => t.clientId === client.id).sort((a, b) => b.year - a.year || b.month - a.month);
    let form = "";
    if (isAdmin) {
      const f = S.tform;
      form = f && f.clientId === client.id ? `<form class="card form-card" data-form="traffic" novalidate><h3>${f.id ? "Editar plano de tráfego" : "Plano de tráfego do mês"}</h3>
        <div class="grid2"><div class="field"><label for="tf-month">Mês</label><select class="select" id="tf-month" data-bind="tform.month" data-num>${monthOptions(f.month)}</select></div>
        <div class="field"><label for="tf-year">Ano</label><input class="input" id="tf-year" type="number" data-bind="tform.year" data-num value="${esc(f.year)}"></div>
        <div class="field"><label for="tf-budget">Verba</label><input class="input" id="tf-budget" data-bind="tform.budget" value="${esc(f.budget)}" placeholder="R$ 1.500 no mês"></div>
        <div class="field"><label for="tf-period">Período</label><input class="input" id="tf-period" data-bind="tform.period" value="${esc(f.period)}" placeholder="01/11 a 30/11"></div></div>
        <div class="field"><label for="tf-objective">Objetivo</label><input class="input" id="tf-objective" data-bind="tform.objective" value="${esc(f.objective)}" placeholder="Mensagens no WhatsApp"></div>
        <div class="field"><label for="tf-audience">Público</label><textarea class="textarea" id="tf-audience" data-bind="tform.audience" style="min-height:70px">${esc(f.audience)}</textarea></div>
        <div class="field"><label for="tf-campaigns">Campanhas previstas</label><textarea class="textarea" id="tf-campaigns" data-bind="tform.campaigns">${esc(f.campaigns)}</textarea></div>
        <div class="field"><label for="tf-notes">Observações</label><textarea class="textarea" id="tf-notes" data-bind="tform.notes" style="min-height:70px">${esc(f.notes)}</textarea></div>
        ${f.error ? `<div class="form-error" role="alert">${I.alert}<span>${esc(f.error)}</span></div>` : ""}
        <div class="row"><button class="btn btn-primary" type="submit" ${S.busy.traffic ? "disabled" : ""}>${S.busy.traffic ? "Salvando…" : "Publicar plano"}</button><button type="button" class="btn btn-ghost" data-a="tf-cancel">Cancelar</button></div></form>`
        : `<div class="row" style="margin-bottom:16px"><button class="btn btn-primary btn-sm" data-a="tf-new" data-id="${esc(client.id)}">Novo plano do mês</button></div>`;
    }
    const cards = list.length ? `<div class="rep-list">${list.map((t) => `<article class="rep">
        <div class="rep-h"><span class="label">Tráfego pago · ${monthName(t.month, t.year)}</span>${isAdmin ? `<button class="btn btn-ghost btn-sm" data-a="tf-edit" data-id="${esc(t.id)}">${I.edit}Editar</button>` : ""}</div>
        <dl class="tf">${TRAFFIC_FIELDS.filter(([k]) => String(t[k] || "").trim()).map(([k, l]) => `<div class="${k === "campaigns" || k === "notes" || k === "audience" ? "full" : ""}"><dt>${l}</dt><dd>${esc(t[k])}</dd></div>`).join("")}</dl>
      </article>`).join("")}</div>` : `<div class="empty">${I.inbox}<b>Nenhum plano de tráfego ainda</b><span>${isAdmin ? "Crie o plano do mês para o cliente acompanhar." : "Quando a VA Mídia publicar o plano de tráfego do mês, ele aparece aqui."}</span></div>`;
    return form + cards;
  }


  /* ---------------- detalhe do conteúdo ---------------- */
  function currentContext() {
    if (!S.open) return null;
    const isAdmin = S.open.from === "admin";
    const data = isAdmin ? S.adata : S.cdata;
    if (!data) return null;
    const c = data.contents.find((x) => x.id === S.open.id);
    if (!c) return null;
    const client = isAdmin ? (data.clients.find((x) => x.id === c.clientId) || { company: "", handle: "" }) : (data.client || S.session.client);
    let siblings = data.contents.filter((x) => x.planningId === c.planningId).sort(byDate);
    if (S.open.scope) { const sc = siblings.filter((x) => kindOf(x) === S.open.scope); if (sc.some((x) => x.id === c.id)) siblings = S.open.scope === "feed" ? sc.sort((a, b) => byDate(b, a)) : sc; }
    const filtered = S.open.filter && S.open.filter !== "all" ? siblings.filter((x) => x.status === S.open.filter) : siblings;
    const nav = filtered.some((x) => x.id === c.id) ? filtered : siblings;
    const comments = (data.comments || []).filter((m) => m.contentId === c.id).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    return { isAdmin, data, c, client, nav, comments, idx: nav.findIndex((x) => x.id === c.id) };
  }

  function viewDetail() {
    const ctx = currentContext();
    if (!ctx) return "";
    const { c, client, nav, idx, isAdmin } = ctx;
    const d = day(c.date);
    const prev = nav[idx - 1], next = nav[idx + 1];
    return `<div class="overlay" data-a="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt-title">
      <div class="sheet-head">
        <button class="btn btn-ghost btn-sm" data-a="close" id="dt-close">${I.back}<span>Voltar</span></button>
        <span class="t">Conteúdo #${pad(c.order || idx + 1)} · ${d ? d.full : "Data não informada"}${isAdmin ? " · " + esc(client.company) : ""}</span>
        <button class="icon-btn" data-a="nav" data-id="${prev ? esc(prev.id) : ""}" ${prev ? "" : "disabled style=\"opacity:.35\""} aria-label="Conteúdo anterior">${I.left}</button>
        <button class="icon-btn" data-a="nav" data-id="${next ? esc(next.id) : ""}" ${next ? "" : "disabled style=\"opacity:.35\""} aria-label="Próximo conteúdo">${I.right}</button>
      </div>
      <div class="sheet-body">
        <div>${kindOf(c) === "story" ? storyPreview(c, client) : kindOf(c) === "destaque" ? highlightPreview(c, client) : postPreview(c, client)}</div>
        <div class="side">
          <h2 id="dt-title" class="${c.title ? "" : "none"}">${esc(c.title || "Título não informado")}</h2>
          ${isAdmin ? adminStatePanel(ctx) : clientStateCard(ctx)}
          ${infoList(c)}
          ${threadHTML(ctx)}
        </div>
      </div></div></div>`;
  }

  function postPreview(c, client) {
    const imgs = imagesOf(c);
    const i = Math.min(S.slide, Math.max(0, imgs.length - 1));
    const handle = client.handle || String(client.company || "cliente").toLowerCase().replace(/[^a-z0-9]+/g, "");
    const cap = c.caption || "";
    const long = cap.length > 240;
    const shownCap = long && !S.ui.capOpen ? cap.slice(0, 220).replace(/\s+\S*$/, "") + "… " : cap;
    const d = day(c.date);
    return `<article class="post" aria-label="Pré-visualização da publicação">
      <header class="post-head"><span class="avatar">${avatarInner(client)}</span><span><b>${esc(handle)}</b><small>Pré-visualização · ${esc(c.type || "formato não informado")}</small></span></header>
      <div class="post-media">${mediaHTML(imgSrc(imgs[i]), c.title)}
        ${c.type === "Reel" ? `<span class="reel">${I.reel}Reel</span>` : ""}
        ${imgs.length > 1 ? `<span class="count">${i + 1}/${imgs.length}</span>
          ${i > 0 ? `<button class="nav prev" data-a="slide" data-d="-1" aria-label="Imagem anterior">${I.left}</button>` : ""}
          ${i < imgs.length - 1 ? `<button class="nav next" data-a="slide" data-d="1" aria-label="Próxima imagem">${I.right}</button>` : ""}` : ""}
      </div>
      ${imgs.length > 1 ? `<div class="dots" aria-hidden="true">${imgs.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>` : ""}
      <div class="post-actions" aria-hidden="true">${I.heart}${I.chat}${I.send}<span class="sp"></span>${I.save}</div>
      <div class="post-body">
        ${cap ? `<p class="cap"><b>${esc(handle)}</b>${esc(shownCap)}${long ? `<button class="more" data-a="cap">${S.ui.capOpen ? " ver menos" : "mais"}</button>` : ""}</p>` : `<p class="cap none">Legenda não informada no planejamento.</p>`}
        <p class="when">${d ? "Programado para " + d.long : "Data de publicação não informada"}</p>
      </div>
    </article>`;
  }

  function infoList(c) {
    const d = day(c.date);
    const f = (k, v, cls, full) => `<div class="${full ? "full" : ""}"><dt>${k}</dt><dd class="${v ? cls || "" : "none"}">${v ? esc(v) : "Não informado"}</dd></div>`;
    return `<dl class="info">
      ${f("Data de publicação", d ? d.upper : "", "big")}
      ${f("Tipo de conteúdo", c.type ? c.type.toUpperCase() : "", "big")}
      ${f("Objetivo", c.objective ? c.objective.toUpperCase() : "", "big")}
      <div><dt>Status</dt><dd><span class="status ${esc(c.status)}">${STATUS[c.status]}</span></dd></div>
      ${f("Descrição", c.description, "", true)}
      ${f("Legenda", c.caption, "", true)}
    </dl>`;
  }

  function clientStateCard(ctx) {
    const { c, idx } = ctx;
    const u = S.ui;
    const num = `<span class="n">Conteúdo #${pad(c.order || idx + 1)}</span>`;
    if (c.status === "aprovado") return `<div class="state-card aprovado"><div class="top">${num}<span class="status aprovado">Aprovado</span></div>
      <div class="big-check"><span class="ok">${I.check}</span><div class="msg"><b>Conteúdo aprovado</b><small>Aprovado em ${esc(dt(c.approvedAt)) || "data não registrada"}</small><small>A VA Mídia seguirá com a produção deste conteúdo.</small></div></div>
      ${u.flash === "approved" ? `<div class="success">${I.check}Aprovação registrada. Obrigado!</div>` : ""}</div>`;
    if (c.status === "em_execucao") return `<div class="state-card em_execucao"><div class="top">${num}<span class="status em_execucao">Em execução</span></div>
      <div class="big-check"><span class="ok exe">${I.edit}</span><div class="msg"><b>Em produção pela VA Mídia</b>${c.approvedAt ? `<small>Aprovado em ${esc(dt(c.approvedAt))}</small>` : ""}<small>O conteúdo está sendo gravado ou criado. Você vê aqui quando for publicado.</small></div></div></div>`;
    if (c.status === "publicado") return `<div class="state-card publicado"><div class="top">${num}<span class="status publicado">Publicado</span></div>
      <div class="big-check"><span class="ok pub">${I.check}</span><div class="msg"><b>Conteúdo publicado</b>${c.publishedAt ? `<small>Publicado em ${esc(dt(c.publishedAt))}</small>` : ""}</div></div></div>`;
    // em análise
    let body;
    if (u.confirm) body = `<div class="confirm" role="alertdialog" aria-labelledby="cf-t"><p id="cf-t">Aprovar <b>${esc(c.title || "este conteúdo")}</b>? Depois da aprovação, a VA Mídia segue com a produção.</p>
      <div class="actions"><button class="btn btn-primary" data-a="approve-yes" id="cf-yes" ${S.busy.approve ? "disabled" : ""}>${S.busy.approve ? "Registrando…" : "Confirmar aprovação"}</button><button class="btn btn-ghost" data-a="approve-no">Cancelar</button></div></div>`;
    else if (u.change) body = `<div class="composer"><div class="field"><label for="chg-text">O que você gostaria de alterar?</label>
      <textarea class="textarea" id="chg-text" data-draft="chg-${esc(c.id)}" maxlength="2000" placeholder="Ex.: Gostaria de alterar a primeira imagem.">${esc(S.drafts["chg-" + c.id] || "")}</textarea></div>
      ${u.err ? `<div class="form-error" role="alert">${I.alert}<span>${esc(u.err)}</span></div>` : ""}
      <div class="actions"><button class="btn btn-primary" data-a="change-send" ${S.busy.change ? "disabled" : ""}>${S.busy.change ? "Enviando…" : "Enviar solicitação"}</button><button class="btn btn-ghost" data-a="change-cancel">Cancelar</button></div></div>`;
    else body = `<div class="actions"><button class="btn btn-primary" data-a="approve">${I.check}Aprovar conteúdo</button><button class="btn btn-outline" data-a="change">${I.edit}${c.changeRequested ? "Pedir outra alteração" : "Solicitar alteração"}</button></div>`;
    return `<div class="state-card em_analise"><div class="top">${num}<span class="status em_analise">Em análise</span></div>
      ${c.changeRequested ? `<div class="pending-change">${I.edit}<span>Você pediu uma alteração. A VA Mídia está ajustando e responde por aqui. Se preferir, você ainda pode aprovar como está.</span></div>` : `<div class="msg"><b>Aguardando sua aprovação</b><small>Confira a arte, a legenda e a estratégia. Se estiver tudo certo, aprove.</small></div>`}
      ${u.flash === "change" ? `<div class="success">${I.check}Solicitação enviada para a VA Mídia.</div>` : ""}
      ${body}</div>`;
  }

  function adminStatePanel(ctx) {
    const { c } = ctx;
    const pend = S.pendingStatus[c.id];
    const sel = pend || c.status;
    const hist = (c.history || []).slice().reverse().slice(0, 6);
    return `<div class="admin-panel">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap"><h3>Controle da VA Mídia</h3><span class="status ${esc(c.status)}">${STATUS[c.status]}</span></div>
      ${c.changeRequested && c.status === "em_analise" ? `<div class="pending-change">${I.edit}<span>O cliente pediu alteração. Veja o pedido nos comentários abaixo.</span></div>` : ""}
      <div class="field"><span class="label">Status do conteúdo</span>
        <div class="seg" role="group" aria-label="Status">${Object.keys(STATUS).map((k) => `<button class="${k}" data-a="pick-status" data-s="${k}" aria-pressed="${sel === k}">${STATUS[k]}</button>`).join("")}</div></div>
      ${pend && pend !== c.status ? `<div class="confirm"><p>Mudar de <b>${STATUS[c.status]}</b> para <b>${STATUS[pend]}</b>?${pend === "em_analise" ? " A aprovação registrada será desfeita." : ""}${pend === "publicado" ? " A data de publicação será registrada agora." : ""}${pend === "em_execucao" ? " O cliente verá que o conteúdo está em produção." : ""}</p>
        <div class="actions"><button class="btn btn-primary btn-sm" data-a="save-status" ${S.busy.status ? "disabled" : ""}>Salvar status</button><button class="btn btn-ghost btn-sm" data-a="cancel-status">Cancelar</button></div></div>` : ""}
      <div class="field"><label for="ad-date">Data de publicação</label><input class="input" type="date" id="ad-date" value="${esc(c.date || "")}" data-a-change="set-date" style="max-width:220px">${c.date ? "" : '<span class="hint">Sem data: o conteúdo aparece em "Sem data definida". Escolha uma data para ele entrar no calendário.</span>'}</div>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        ${c.changeRequested && c.status === "em_analise" ? `<button class="btn btn-sm" data-a="resolve">${I.check}Marcar alteração como resolvida</button>` : ""}
        ${S.info.canUploadImages ? `<label class="btn btn-sm" for="img-swap">${I.upload}Trocar imagem</label><input type="file" id="img-swap" accept="image/*" class="sr" data-a-change="swap-image">` : ""}
        ${S.ui.del ? `<button class="btn btn-danger btn-sm" data-a="delete-yes">Confirmar exclusão</button><button class="btn btn-ghost btn-sm" data-a="delete-no">Cancelar</button>` : `<button class="btn btn-ghost btn-sm" data-a="delete">${I.trash}Excluir</button>`}
      </div>
      ${c.approvedAt ? `<p class="hint">Aprovado em ${esc(dt(c.approvedAt))}${c.publishedAt ? ` · Publicado em ${esc(dt(c.publishedAt))}` : ""}</p>` : ""}
      ${hist.length ? `<div class="history"><span class="label">Histórico</span>${hist.map((h) => `<span><i style="background:var(--st-${h.status === "em_analise" ? "analise" : h.status === "em_execucao" ? "exec" : h.status})"></i>${STATUS[h.status] || esc(h.status)} · ${esc(dt(h.at))}${h.by ? " · " + esc(h.by) : ""}</span>`).join("")}</div>` : ""}
    </div>`;
  }

  function threadHTML(ctx) {
    const { c, comments, isAdmin } = ctx;
    const key = (isAdmin ? "adm-" : "cm-") + c.id;
    return `<section class="thread" aria-label="Comentários">
      <div class="thread-head"><span class="label">Comentários · ${comments.length}</span></div>
      <div class="msgs">${comments.length ? comments.map((m) => `<div class="msg-b ${m.authorRole === "agency" ? "agency" : "client"} ${m.kind === "change_request" ? "change" : ""}">
          <div class="bub">${esc(m.message)}</div>
          <div class="by"><b>${esc(m.authorName || (m.authorRole === "agency" ? "VA Mídia" : "Cliente"))}</b><span>${esc(dt(m.createdAt))}</span>${m.kind === "change_request" ? '<span class="tag change">Solicitação de alteração</span>' : ""}</div>
        </div>`).join("") : `<p class="hint">Nenhum comentário ainda.${isAdmin ? "" : " Escreva abaixo se quiser comentar algo com a VA Mídia."}</p>`}</div>
      <div class="composer"><label class="sr" for="cm-text">${isAdmin ? "Responder como VA Mídia" : "Escreva um comentário"}</label>
        <textarea class="textarea" id="cm-text" data-draft="${esc(key)}" maxlength="2000" placeholder="${isAdmin ? "Responder como VA Mídia…" : "Escreva um comentário para a VA Mídia…"}" style="min-height:76px">${esc(S.drafts[key] || "")}</textarea>
        ${S.ui.cmErr ? `<div class="form-error" role="alert">${I.alert}<span>${esc(S.ui.cmErr)}</span></div>` : ""}
        <div class="row"><button class="btn btn-sm" data-a="comment-send" ${S.busy.comment ? "disabled" : ""}>${I.send}${S.busy.comment ? "Enviando…" : "Enviar comentário"}</button></div>
      </div>
    </section>`;
  }

  /* ============================================================
     ADMIN
     ============================================================ */
  function adminTop() {
    const a = S.adata;
    const unread = a ? a.notifications.filter((n) => !n.read).length : 0;
    const tab = (k, l) => `<button class="tab" data-a="atab" data-t="${k}" ${S.adminTab === k ? 'aria-current="page"' : ""}>${l}</button>`;
    return `<header class="topbar"><div class="wrap">${brandHTML("Área da VA Mídia")}
      <nav class="tabs" aria-label="Seções">${tab("overview", "Visão geral")}${tab("import", "Importar planejamento")}${tab("clients", "Clientes")}</nav>
      <span class="spacer"></span>
      <button class="icon-btn" data-a="atab" data-t="overview" aria-label="Notificações: ${unread} não lidas">${I.bell}${unread ? `<span class="badge-count">${unread}</span>` : ""}</button>
      <button class="btn btn-ghost btn-sm" data-a="admin-exit">${I.out}<span class="sr">Sair da área da equipe</span></button>
    </div></header>`;
  }
  function viewAdmin() {
    if (!S.adata) return adminTop() + `<div class="wrap page">${viewBoot()}</div>`;
    let body;
    if (S.adminTab === "import") body = viewImport();
    else if (S.adminTab === "clients") body = viewClients();
    else if (S.adminClientId) body = viewAdminClient();
    else body = viewOverview();
    return adminTop() + `<main class="wrap page">${body}</main>`;
  }

  function lastActivityByClient(a) {
    const m = {};
    a.notifications.forEach((n) => { if (!m[n.clientId] || n.createdAt > m[n.clientId]) m[n.clientId] = n.createdAt; });
    return m;
  }
  function noteCard(n) {
    const label = n.type === "change_request" ? "Solicitação de alteração" : n.type === "approval" ? "Conteúdo aprovado" : "Novo comentário em conteúdo";
    return `<article class="note ${n.read ? "" : "unread"} ${n.type === "change_request" ? "change" : ""}">
      <div class="h"><b>${label}</b>${n.read ? "" : '<span class="tag demo">Nova</span>'}</div>
      <dl><dt>Cliente</dt><dd>${esc(n.clientName || "")}</dd><dt>Conteúdo</dt><dd>${esc(n.contentTitle || "")}</dd><dt>Data</dt><dd>${esc(dt(n.createdAt))}</dd></dl>
      ${n.type !== "approval" ? `<q>${esc(n.message)}</q>` : ""}
      <div class="f">${n.read ? "" : `<button class="btn btn-ghost btn-sm" data-a="note-read" data-id="${esc(n.id)}">Marcar como lida</button>`}<button class="btn btn-primary btn-sm" data-a="note-open" data-id="${esc(n.id)}">Visualizar</button></div>
    </article>`;
  }
  function viewOverview() {
    const a = S.adata;
    const activeClients = a.clients.filter((c) => c.status !== "inativo");
    const c = counts(a.contents);
    const unread = a.notifications.filter((n) => !n.read).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
    const recent = a.notifications.slice().sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt))).slice(0, 12);
    const last = lastActivityByClient(a);
    const rows = a.clients.slice().sort((x, y) => String(last[y.id] || "").localeCompare(String(last[x.id] || "")) || x.company.localeCompare(y.company)).map((cl) => {
      const p = pickPlanning(a, cl.id, "admin-" + cl.id);
      const list = p ? a.contents.filter((x) => x.planningId === p.id) : [];
      const k = counts(list);
      return `<tr class="click" data-a="aclient" data-id="${esc(cl.id)}" tabindex="0">
        <td class="cname"><b>${esc(cl.company)}</b><small>${cl.handle ? "@" + esc(cl.handle) : ""}${cl.demo ? ' · <span class="tag demo" style="padding:1px 6px">Demo</span>' : ""}${cl.status === "inativo" ? ' · <span class="tag">Pausado</span>' : ""}</small></td>
        <td>${p ? monthName(p.month, p.year) : '<span class="muted">Sem planejamento</span>'}</td>
        <td class="n">${pad(k.all)}</td><td class="n">${pad(k.em_analise)}</td><td class="n">${pad(k.aprovado)}</td><td class="n">${pad(k.em_execucao)}</td><td class="n">${pad(k.publicado)}</td>
        <td class="n ${k.change ? "hl" : ""}">${pad(k.change)}</td>
        <td class="muted" style="white-space:nowrap">${last[cl.id] ? esc(ago(last[cl.id])) : "—"}</td>
        <td><span class="btn btn-sm">Abrir</span></td></tr>`;
    }).join("");
    const envNote = S.info.mode === "artifact"
      ? `Dados salvos no banco deste portal no Claude. Cada cliente só vê o próprio planejamento pelo app, mas o isolamento no servidor por cliente e o acesso de clientes externos exigem o modo servidor (Supabase) — veja o guia de produção.`
      : S.info.mode === "supabase" ? `Dados no servidor Supabase, com isolamento por cliente aplicado no banco (RLS + funções).` : `Modo local: nada é salvo.`;
    return `<div class="admin-top"><h1>Visão geral</h1><p class="muted" style="margin-top:8px">Planejamentos, aprovações e pedidos dos clientes, em tempo real.</p></div>
      <div class="kpis">
        <div class="kpi"><span class="v">${pad(activeClients.length)}</span><span class="k">Clientes ativos</span></div>
        <div class="kpi"><span class="v">${pad(c.em_analise)}</span><span class="k"><i style="background:var(--st-analise)"></i>Em análise</span></div>
        <div class="kpi"><span class="v">${pad(c.aprovado)}</span><span class="k"><i style="background:var(--st-aprovado)"></i>Aprovados</span></div>
        <div class="kpi"><span class="v">${pad(c.em_execucao)}</span><span class="k"><i style="background:var(--st-exec)"></i>Em execução</span></div>
        <div class="kpi"><span class="v">${pad(c.publicado)}</span><span class="k"><i style="background:var(--st-publicado)"></i>Publicados</span></div>
        <div class="kpi"><span class="v" style="${c.change ? "color:var(--danger)" : ""}">${pad(c.change)}</span><span class="k"><i style="background:var(--danger)"></i>Alterações pedidas</span></div>
      </div>

  function newImport(clientId) {
    const now = new Date();
    return { text: "", files: [], clientId: clientId || "", month: 0, year: now.getFullYear(), parsed: null, rows: null, untouched: [], choices: {}, itemFiles: {}, error: "", busy: false, ai: false, sample: false };

  function impExisting(im) {
    const a = S.adata;
    const p = a.plannings.find((x) => x.clientId === im.clientId && x.month === im.month && x.year === im.year);
    return { planning: p || null, contents: p ? a.contents.filter((c) => c.planningId === p.id) : [] };
  }
  function recomputeMerge() {
    const im = S.imp;
    if (!im.parsed) return;
    const ex = impExisting(im);
    im.parsed.items.forEach((it, i) => {
      it._attached = resolveItemImages(i, it).files.length > 0;
      if (!it.date && it.dateRaw && !it._manualDate) { const d = P.parseDate(it.dateRaw, { year: im.year, month: im.month }); if (d) { it.date = d; it.warnings = it.warnings.filter((w) => !/^Data/.test(w)); } }
    });
    const m = P.planMerge(im.parsed.items, ex.contents);
    im.rows = m.rows; im.untouched = m.untouched;
  }
  function fileFor(name) {
    const n = P.norm(name).replace(/^.*[\\/]/, "");
    return S.imp.files.find((f) => P.norm(f.name) === n) || S.imp.files.find((f) => P.norm(f.name).replace(/\.[a-z0-9]+$/, "") === n.replace(/\.[a-z0-9]+$/, ""));
  }
  const isUrlish = (s) => /^(https?:|data:|blob:|asset:|demo\/)/i.test(s);
  function resolveItemImages(idx, item) {
    const own = S.imp.itemFiles[idx];
    if (own && own.length) return { files: own, urls: [], missing: [] };
    const files = [], urls = [], missing = [];
    item.images.forEach((x) => { if (isUrlish(x)) urls.push(x); else { const f = fileFor(x); if (f) files.push(f); else missing.push(x); } });
    return { files, urls, missing };
  }

  const urlCache = new WeakMap();

    return `<div class="pv ${r.action}" style="animation-delay:${Math.min(i, 10) * 30}ms">

  function parseImport(fromAI) {
    const im = S.imp;
    im.error = ""; im.choices = {}; im.itemFiles = {};
    const r = P.parsePlanning(im.text, { year: im.year || new Date().getFullYear(), month: im.month });
    if (!r.items.length) { im.parsed = null; im.rows = null; im.error = r.errors[0] || "Não encontrei conteúdos no texto."; render(); return; }
    im.parsed = r; if (fromAI) im.parsed.format = "Interpretado com IA";
    if (r.client) { const m = P.matchClient(r.client, S.adata.clients); if (m) im.clientId = m.id; }
    if (r.month) im.month = r.month; if (r.year) im.year = r.year;
    recomputeMerge(); render();
    const t = document.querySelector(".pv-list"); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  async function aiImport() {
    const im = S.imp;
    if (!im.text.trim()) { im.error = "Cole o planejamento antes de pedir para a IA interpretar."; render(); return; }
    const sample = S.store.sample; if (!sample) return;
    im.ai = true; im.error = ""; render();
    const prompt = `Você converte planejamentos de conteúdo de redes sociais em JSON para um sistema de aprovação.
Regras obrigatórias:
- Responda somente com um objeto JSON neste formato: {"cliente": "", "mes": "", "conteudos": [{"data": "", "tipo": "", "titulo": "", "objetivo": "", "descricao": "", "legenda": "", "imagem": ""}]}
- Copie os textos exatamente como aparecem. Não resuma, não corrija, não traduza e não complete frases.
- Se uma informação não estiver no texto, use "". Nunca invente data, título, legenda, objetivo, descrição, tipo ou imagem.
- "data": como aparece no texto (ex.: "03/10"). "mes": mês e ano de referência se aparecerem (ex.: "outubro de 2026").
- "imagem": nomes de arquivo ou links citados para aquele conteúdo, separados por vírgula.
- Um item em "conteudos" para cada publicação planejada, na ordem do texto.

Texto do planejamento:
"""
${im.text.slice(0, 50000)}
"""`;
    try {
      const j = await sample.json(prompt, { modelTier: "default" });
      if (!j || !Array.isArray(j.conteudos)) throw { code: "invalid_json" };
      im.aiSource = im.text;
      const saved = im.text;
      im.text = JSON.stringify(j, null, 2);
      parseImport(true);
      im.text = saved;
    } catch (e) {
      const m = { not_granted: "O uso da IA não foi autorizado nesta visualização.", rate_limited: "Limite de uso atingido. Tente de novo em alguns minutos.", invalid_json: "A IA não devolveu um resultado válido. Tente de novo ou use campos como “Data:” e “Título:”.", prompt_too_large: "Texto grande demais. Divida o planejamento em partes." };
      im.error = m[e && e.code] || "A IA não conseguiu interpretar agora. Use “Interpretar planejamento”.";
    }
    im.ai = false; render();
  }
  async function applyImport() {
    const im = S.imp, a = S.adata;
    if (!im.clientId || !im.month || !im.year) return;
    im.busy = true; render();
    try {
      const ex = impExisting(im);
      const planningId = ex.planning ? ex.planning.id : `${im.clientId}-${im.year}-${pad(im.month)}-${Math.random().toString(36).slice(2, 6)}`;
      const plan = { clientId: im.clientId, planning: { id: planningId, create: !ex.planning, month: im.month, year: im.year, title: `Planejamento de conteúdo · ${monthName(im.month, im.year)}` }, ops: [] };
      let order = ex.contents.reduce((m, c) => Math.max(m, c.order || 0), 0);
      const now = ST.nowISO();
      const tally = { create: 0, update: 0, keep: 0 };
      for (let i = 0; i < im.rows.length; i++) {
        const r = im.rows[i], it = r.item, ch = im.choices[i];
        const doCreate = r.action === "create" || (r.action === "ambiguous" && ch === "create");
        const doUpdate = r.action === "update" || (r.action === "conflict" && ch === "apply");
        if (!doCreate && !doUpdate) { tally.keep++; continue; }
        const res = resolveItemImages(i, it);
        const refs = [];
        for (const f of res.files) refs.push(await S.store.uploadImage(f));
        res.urls.forEach((u) => refs.push(u));
        if (doCreate) {
          const status = it.status || "em_analise";
          order++;
          plan.ops.push({ kind: "create", id: `${planningId}-${ST.uid("c")}`, data: {
            planningId, clientId: im.clientId, order, ref: it.ref, date: it.date, type: it.type, title: it.title, objective: it.objective, description: it.description, caption: it.caption,
            image: refs[0] || "", images: refs.length > 1 ? refs : [], status, changeRequested: false,
            approvedAt: status !== "em_analise" ? now : null, publishedAt: status === "publicado" ? now : null,
            createdAt: now, updatedAt: now, history: [{ status, at: now, by: "VA Mídia (importação)" }], demo: false } });
          tally.create++;
        } else {
          const data = { updatedAt: now };
          r.changes.forEach((f) => { if (f !== "images") data[f] = it[f]; });
          if (refs.length) { data.image = refs[0]; data.images = refs.length > 1 ? refs : []; }
          if (r.action === "conflict" && r.match.status === "aprovado") { data.status = "em_analise"; data.approvedAt = null; data.history = (r.match.history || []).concat({ status: "em_analise", at: now, by: "VA Mídia (planejamento atualizado)" }); }
          plan.ops.push({ kind: "update", id: r.match.id, data });
          tally.update++;
        }
      }
      await S.store.applyImport(plan);
      let removed = 0;
      if (im.removeOld && ex.planning) for (const c of im.untouched) { await S.store.deleteContent(c.id); removed++; }
      toast(`Planejamento publicado: ${tally.create} novos, ${tally.update} atualizados, ${tally.keep} mantidos${removed ? `, ${removed} removidos` : ""}.`);
      S.planningId["admin-" + im.clientId] = planningId;
      S.adminClientId = im.clientId; S.adminTab = "overview"; S.filter = "all"; S.ctab = "cal";
      S.imp = newImport();
      render(); scrollTo(0, 0);
    } catch (e) { im.busy = false; im.error = errMsg(e); toast(errMsg(e), "err"); render(); }
  }

  /* ---------------- eventos ---------------- */
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-a]");
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.a];
    if (!fn) return;
    if (el.dataset.a === "overlay" && ev.target !== el) return;
    ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener("keydown", (ev) => {
    const tr = ev.target.closest && ev.target.closest("tr[data-a]");
    if (tr && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); actions[tr.dataset.a](tr, ev); return; }
    if (!S.open) return;
    const typing = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName);
    if (ev.key === "Escape") { if (S.ui.confirm || S.ui.change) { S.ui.confirm = false; S.ui.change = false; render(); } else closeContent(); }
    else if (!typing && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
      const b = document.querySelectorAll('.sheet-head [data-a="nav"]')[ev.key === "ArrowLeft" ? 0 : 1];
      if (b && b.dataset.id) b.click();
    }
  });
  function setPath(path, value) {
    const parts = path.split("."); let o = S;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset.bind) { setPath(t.dataset.bind, t.dataset.num !== undefined ? +t.value || 0 : t.value); if (t.dataset.recompute !== undefined && S.imp) { recomputeMerge(); if (t.tagName === "SELECT") render(); } }
    if (t.dataset.draft) S.drafts[t.dataset.draft] = t.value;
  });
  document.addEventListener("change", async (ev) => {
    const t = ev.target;
    if (t.dataset.bind && t.tagName === "SELECT") { setPath(t.dataset.bind, t.dataset.num !== undefined ? +t.value || 0 : t.value); if (t.dataset.recompute !== undefined) recomputeMerge(); render(); return; }
    if (t.dataset.bind && t.dataset.recompute !== undefined) { recomputeMerge(); render(); return; }
    const a = t.dataset.aChange; if (!a) return;
    if (a === "imp-files") { S.imp.files = S.imp.files.concat(Array.from(t.files || [])); recomputeMerge(); render(); }
    if (a === "imp-item-file") { const i = +t.dataset.i; const fs = Array.from(t.files || []); S.imp.itemFiles[i] = fs; S.imp.parsed.items[i]._files = fs; recomputeMerge(); render(); }
    if (a === "imp-choice") { S.imp.choices[+t.dataset.i] = t.value; }
    if (a === "imp-rm") { S.imp.removeOld = t.checked; render(); }
    if (a === "imp-date" && t.value) { const it = S.imp.parsed.items[+t.dataset.i]; it.date = t.value; it._manualDate = true; it.warnings = it.warnings.filter((w) => !/^Data/.test(w)); recomputeMerge(); render(); }
    if (a === "set-date") { try { await S.store.setContentDate(S.open.id, t.value || ""); toast(t.value ? "Data atualizada." : "Data removida."); } catch (e) { toast(errMsg(e), "err"); } }
    if (a === "client-logo" && t.files[0]) { try { const ref = await S.store.uploadImage(t.files[0]); await S.store.setClientLogo(t.dataset.id, ref); toast("Logo do cliente atualizado."); } catch (e) { toast(errMsg(e), "err"); } }
    if (a === "rp-file" && S.rform) { S.rform.file = t.files[0] || null; render(); }
    if (a === "swap-image" && t.files[0]) {
      try { const ref = await S.store.uploadImage(t.files[0]); await S.store.setContentImage(S.open.id, ref); toast("Imagem atualizada."); } catch (e) { toast(errMsg(e), "err"); }
    }
    if (a === "logo" && t.files[0]) {
      try { const ref = await S.store.uploadImage(t.files[0]); await S.store.saveBrand({ logo: ref }); toast("Logo atualizado."); } catch (e) { toast(errMsg(e), "err"); }
    }
  });
  document.addEventListener("submit", async (ev) => {
    const f = ev.target.dataset.form; if (!f) return;
    ev.preventDefault();
    if (f === "login") {
      S.busy.login = true; S.login.error = ""; render();
      try { const s = await S.store.clientLogin(S.login.email, S.login.code); S.busy.login = false; S.login = { email: "", code: "", error: "" }; openClient(s); scrollTo(0, 0); }
      catch (e) { S.busy.login = false; S.login.error = errMsg(e); render(); const i = $("#lg-code"); if (i) i.focus(); }
    }
    if (f === "alogin") {
      S.busy.alogin = true; S.alogin.error = ""; render();
      try { const acc = await S.store.adminLogin(S.alogin.email, S.alogin.password); S.busy.alogin = false; S.alogin = { email: "", password: "", error: "" }; S.adminAccess = acc; if (acc.ok) enterAdmin(); else { S.view = "denied"; render(); } }
      catch (e) { S.busy.alogin = false; S.alogin.error = errMsg(e); render(); }
    }
    if (f === "report") {
      const r = S.rform;
      if (!String(r.title || "").trim() && !String(r.summary || "").trim()) { r.error = "Dê um título ou escreva um resumo."; render(); return; }
      if (r.url && !/^https?:\/\//i.test(r.url.trim())) { r.error = "O link precisa começar com https://"; render(); return; }
      if (!r.url && !r.file && !String(r.summary || "").trim()) { r.error = "Inclua um link, um arquivo ou um resumo."; render(); return; }
      S.busy.report = true; r.error = ""; render();
      try {
        const fileUrl = r.file ? await S.store.uploadImage(r.file) : "";
        await S.store.saveReport({ clientId: r.clientId, month: r.month, year: r.year, title: r.title.trim(), summary: r.summary.trim(), url: (r.url || "").trim(), fileUrl });
        S.rform = null; toast("Relatório publicado para o cliente.");
      } catch (e) { r.error = errMsg(e); }
      S.busy.report = false; render();
    }
    if (f === "traffic") {
      const t = S.tform;
      S.busy.traffic = true; t.error = ""; render();
      try {
        const data = { id: t.id, clientId: t.clientId, month: t.month, year: t.year };
        TRAFFIC_FIELDS.forEach(([k]) => (data[k] = String(t[k] || "").trim()));
        if (!TRAFFIC_FIELDS.some(([k]) => data[k])) throw new ST.PortalError("empty", "Preencha pelo menos um campo do plano.");
        await S.store.saveTraffic(data);
        S.tform = null; toast("Plano de tráfego publicado.");
      } catch (e) { t.error = errMsg(e); }
      S.busy.traffic = false; render();
    }
    if (f === "client") {
      S.busy.client = true; S.clientForm.error = ""; render();
      try {
        const cf = S.clientForm; const r = await S.store.saveClient(cf);
        const isNew = !cf.id; S.clientForm = null;
        if (isNew || r.code !== cf.code) S.ui.newCode = { company: cf.company, email: cf.email.trim().toLowerCase(), code: r.code };
        toast(isNew ? "Cliente cadastrado." : "Cliente atualizado.");
      } catch (e) { S.clientForm.error = errMsg(e); }
      S.busy.client = false; render();
    }
  });
  // arrastar e soltar imagens no importador
  document.addEventListener("dragover", (ev) => { const d = ev.target.closest && ev.target.closest("[data-drop]"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
  document.addEventListener("dragleave", (ev) => { const d = ev.target.closest && ev.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", (ev) => {
    const d = ev.target.closest && ev.target.closest("[data-drop]"); if (!d) return;
    ev.preventDefault(); d.classList.remove("over");
    const files = Array.from(ev.dataTransfer.files || []).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|svg)$/i.test(f.name));
    S.imp.files = S.imp.files.concat(files); recomputeMerge(); render();
  });
  // imagem quebrada -> aviso visual
  document.addEventListener("error", (ev) => {
    const t = ev.target;
    if (t && t.tagName === "IMG" && t.hasAttribute("data-fallback")) {
      const s = document.createElement("span"); s.className = "noimg"; s.innerHTML = I.image + "<span>Imagem indisponível</span>"; t.replaceWith(s);
    }
  }, true);

  /* ---------------- início ---------------- */
  async function boot() {
    render();
    try {
      S.store = await ST.pickStore((m) => { S.bootMsg = m; });
      S.info = S.store.info;
      S.store.watchPublic((p) => { S.pub = p; if (S.view !== "boot") render(); });
      const hash = (location.hash || "").replace("#", "");
      if (hash === "admin") { await goAdmin(); return; }
      const restored = await S.store.restoreClient().catch(() => null);
      if (restored) { openClient(restored); return; }
      S.view = hash === "entrar" ? "login" : "home"; render();
    } catch (e) {
      S.fatal = (e && e.message) || "Não foi possível iniciar o portal."; render();
    }
  }
  boot();
})();

</script>
</body>
</html>
