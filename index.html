<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* VA Mídia · Content Approval Portal
   Direção: preto predominante, amarelo como destaque, superfícies escuras, bordas finas.
   Visual único escuro por escolha de marca (não segue o tema claro do visualizador). */
:root{
  color-scheme: dark;
  --bg:#0B0B0C;
  --bg-2:#101012;
  --surface:#141416;
  --surface-2:#1B1B1E;
  --surface-3:#232327;
  --line:#2A2A2F;
  --line-soft:#1F1F23;
  --text:#F3F1EA;
  --text-2:#BDB9AE;
  --muted:#85817A;
  --yellow:#F4C542;
  --yellow-hi:#FFD45C;
  --yellow-ink:#16120A;
  --yellow-soft:rgba(244,197,66,.11);
  --yellow-line:rgba(244,197,66,.32);
  --st-analise:#E9BE45;
  --st-analise-bg:rgba(233,190,69,.12);
  --st-aprovado:#72C495;
  --st-aprovado-bg:rgba(114,196,149,.12);
  --st-publicado:#93B8DE;
  --st-publicado-bg:rgba(147,184,222,.12);
  --danger:#E8836F;
  --danger-bg:rgba(232,131,111,.12);
  --radius-s:10px;
  --radius:16px;
  --radius-l:24px;
  --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --glow:0 0 0 1px var(--yellow-line), 0 10px 40px -12px rgba(244,197,66,.35);
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--yellow);color:var(--yellow-ink)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* ---------- marca ---------- */
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;background:none;border:0;padding:0}
.brand img{height:30px;width:auto;display:block}
.wordmark{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:17px;line-height:1;white-space:nowrap}
.wordmark b{color:var(--yellow);font-weight:700}
.brand-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;line-height:1.3}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:13px}
.who small{color:var(--muted);font-size:11.5px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:11px 18px;font-weight:600;font-size:13.5px;letter-spacing:.02em;transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease),box-shadow .25s var(--ease),color .2s;text-decoration:none;white-space:nowrap;min-height:44px}
.btn:hover{background:var(--surface-3);border-color:#3a3a40}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;font-weight:700}
.btn-primary:hover{background:var(--yellow-hi);border-color:var(--yellow-hi);box-shadow:var(--glow)}
.btn-outline{background:transparent;border-color:var(--line);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.btn-outline:hover{border-color:var(--yellow-line);background:var(--yellow-soft)}
.btn-ghost{background:transparent;border-color:transparent;padding-inline:12px}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-soft)}
.btn-danger{background:transparent;border-color:rgba(232,131,111,.4);color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-sm{min-height:36px;padding:7px 13px;font-size:12.5px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);transition:all .2s var(--ease);position:relative;flex:none}
.icon-btn:hover{border-color:var(--yellow-line);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.badge-count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--yellow);color:var(--yellow-ink);font:700 11px/19px var(--f-mono);text-align:center;box-shadow:0 0 0 3px var(--bg)}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.input,.textarea,.select{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s;min-height:48px}
.input:hover,.textarea:hover,.select:hover{border-color:#38383e}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--yellow-line);box-shadow:0 0 0 4px rgba(244,197,66,.08);background:var(--surface)}
.textarea{resize:vertical;min-height:96px;line-height:1.5}
.input.code{font-family:var(--f-mono);letter-spacing:.32em;text-transform:uppercase;font-size:17px}
.hint{font-size:12.5px;color:var(--muted)}
.form-error{display:flex;gap:10px;align-items:flex-start;background:var(--danger-bg);border:1px solid rgba(232,131,111,.35);color:#F4B3A6;border-radius:12px;padding:11px 14px;font-size:13.5px}
.form-error svg{width:17px;height:17px;flex:none;margin-top:2px}

/* ---------- status ---------- */
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:5px 10px 5px 9px;border-radius:999px;white-space:nowrap;line-height:1.2}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.status.em_analise{color:var(--st-analise);background:var(--st-analise-bg)}
.status.aprovado{color:var(--st-aprovado);background:var(--st-aprovado-bg)}
.status.publicado{color:var(--st-publicado);background:var(--st-publicado-bg)}
.status.em_analise::before{animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,190,69,.5)}50%{box-shadow:0 0 0 4px rgba(233,190,69,0)}}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.tag.demo{border-color:var(--yellow-line);color:var(--yellow)}
.tag.warn{border-color:rgba(232,131,111,.4);color:var(--danger)}
.tag.change{border-color:rgba(232,131,111,.45);color:#F1A08F;background:var(--danger-bg)}

/* ---------- mode banner ---------- */
.mode-banner{font-size:12.5px;color:var(--text-2);background:var(--surface);border-bottom:1px solid var(--line-soft)}
.mode-banner .wrap{display:flex;gap:10px;align-items:center;min-height:38px;padding-block:6px}
.mode-banner svg{width:15px;height:15px;color:var(--yellow);flex:none}

/* ---------- home ---------- */
.home{position:relative;overflow:hidden}
.home::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:720px;background:radial-gradient(560px 360px at 18% 20%,rgba(244,197,66,.13),transparent 70%),radial-gradient(420px 300px at 88% 10%,rgba(244,197,66,.06),transparent 70%);pointer-events:none}
.home-head{display:flex;align-items:center;gap:16px;padding-block:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(28px,6vw,72px) clamp(40px,7vw,90px);position:relative}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--yellow)}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4.6vw,56px);line-height:1.06;letter-spacing:-.02em;margin-top:18px}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p.lead{color:var(--text-2);font-size:clamp(15px,1.4vw,17.5px);max-width:52ch;margin-top:20px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-visual{position:relative}
.mock{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius-l);padding:18px;box-shadow:var(--shadow);transform:rotate(1.2deg)}
.mock-head{display:flex;align-items:center;gap:10px;padding:4px 4px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.mock-head .dot{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--yellow),#8a6a14,var(--yellow));padding:2px}
.mock-head .dot i{display:block;width:100%;height:100%;border-radius:50%;background:var(--surface-2)}
.mock-lines{display:flex;flex-direction:column;gap:6px}
.mock-lines span{height:7px;border-radius:4px;background:var(--surface-3);width:110px}
.mock-lines span+span{width:70px;opacity:.6}
.mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mock-tile{aspect-ratio:4/5;border-radius:10px;position:relative;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.mock-tile .d{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--text-2)}
.mock-tile .s{width:8px;height:8px;border-radius:50%;position:absolute;top:8px;right:8px}
.mock-tile.t1{background:linear-gradient(160deg,#2a2413,#141416 70%)}
.mock-tile.t2{background:radial-gradient(circle at 70% 30%,#3a3016 0 28%,transparent 29%),#18181b}
.mock-tile.t3{background:repeating-linear-gradient(-20deg,#1d1d20 0 14px,#232327 14px 28px)}
.mock-tile.t4{background:linear-gradient(200deg,#1f2a22,#141416 75%)}
.mock-tile.t5{background:radial-gradient(circle at 30% 70%,#2c2f36 0 35%,transparent 36%),#16161a}
.mock-tile.t6{background:linear-gradient(135deg,#2d2511 0 50%,#1a1a1d 50%)}
.mock-float{position:absolute;left:-22px;bottom:-22px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transform:rotate(-1.5deg)}
.mock-float .ok{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--st-aprovado-bg);color:var(--st-aprovado)}
.mock-float .ok svg{width:18px;height:18px}
.mock-float b{display:block;font-size:13.5px}
.mock-float small{color:var(--muted);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--radius-l);overflow:hidden;margin-bottom:clamp(40px,7vw,90px)}
.step{background:var(--bg);padding:26px 24px 28px;display:flex;flex-direction:column;gap:10px}
.step .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--yellow)}
.step h3{font-size:17px;font-weight:600}
.step p{color:var(--text-2);font-size:14px}
.home-foot{border-top:1px solid var(--line-soft);padding-block:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.linkish{background:none;border:0;padding:0;color:var(--text-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.linkish:hover{color:var(--yellow);text-decoration-color:var(--yellow)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding-block:40px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(244,197,66,.10),transparent 62%);top:-340px;left:50%;transform:translateX(-50%);pointer-events:none}
.login-card{width:100%;max-width:420px;position:relative;display:flex;flex-direction:column;gap:26px}
.login-card .panel{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius-l);padding:clamp(22px,5vw,34px);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.login-title{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.demo-box{border:1px dashed var(--yellow-line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:rgba(244,197,66,.035)}
.demo-box .row{justify-content:space-between;flex-wrap:wrap;gap:8px}
.demo-cred{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);text-align:left;width:100%;transition:border-color .2s}
.demo-cred:hover{border-color:var(--yellow-line)}
.demo-cred svg{width:18px;height:18px;flex:none;color:var(--muted)}
.demo-cred > span{min-width:0;display:flex;flex-direction:column}
.demo-cred b{font-size:13.5px;display:block}
.demo-cred small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.back-link{align-self:center}

/* ---------- dashboard do cliente ---------- */
.page{padding-block:clamp(22px,4vw,40px) 80px}
.greet{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 30px;justify-content:space-between}
.greet h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.02em;line-height:1.1}
.greet .sub{color:var(--text-2);margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.month-switch{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);transition:all .2s var(--ease);min-height:38px}
.chip:hover{border-color:#3d3d44;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.callout{margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--radius);border:1px solid var(--yellow-line);background:linear-gradient(90deg,rgba(244,197,66,.10),rgba(244,197,66,.02) 70%)}
.callout.calm{border-color:var(--line);background:var(--surface)}
.callout .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--yellow);color:var(--yellow-ink);flex:none}
.callout.calm .ic{background:var(--st-aprovado-bg);color:var(--st-aprovado)}
.callout .ic svg{width:20px;height:20px}
.callout .tx{flex:1;min-width:200px}
.callout .tx b{display:block;font-size:15.5px}
.callout .tx span{color:var(--text-2);font-size:13.5px}

.summary{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line)}
.sum{background:var(--bg);border:0;padding:16px 18px 15px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:background .2s var(--ease);position:relative;margin-left:1px}
.sum:first-child{margin-left:0}
.sum:hover{background:var(--bg-2)}
.sum .v{font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sum .k{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sum .k i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sum.em_analise .k i{background:var(--st-analise)}
.sum.aprovado .k i{background:var(--st-aprovado)}
.sum.publicado .k i{background:var(--st-publicado)}
.sum[aria-pressed="true"]{background:var(--surface)}
.sum[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--yellow)}
.sum[aria-pressed="true"] .k{color:var(--text)}

.feed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
.feed-head h2{font-size:13px;font-family:var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;animation:rise .45s var(--ease) both}
.tile:focus-visible{outline:2px solid var(--yellow);outline-offset:4px;border-radius:14px}
.tile .media{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-soft);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s}
.tile:hover .media{transform:translateY(-3px);box-shadow:0 20px 40px -22px rgba(0,0,0,.9),0 0 0 1px var(--yellow-line)}
.tile .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.tile:hover .media img{transform:scale(1.025)}
.tile .fmt{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(11,11,12,.62);backdrop-filter:blur(6px);color:#fff}
.tile .fmt svg{width:16px;height:16px}
.tile .num{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;padding:4px 8px;border-radius:7px;background:rgba(11,11,12,.62);backdrop-filter:blur(6px);color:#fff}
.tile .flag{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.tile .flag span{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;background:rgba(20,16,10,.85);backdrop-filter:blur(6px);border:1px solid rgba(232,131,111,.5);color:#F5B2A3;display:inline-flex;align-items:center;gap:6px}
.tile .flag span svg{width:13px;height:13px}
.tile .flag span.cm{border-color:rgba(255,255,255,.2);color:#eee}
.tile .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-inline:2px}
.tile .when{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--text-2);text-transform:uppercase;white-space:nowrap}
.tile .when b{color:var(--text);font-weight:600}
.tile .ttl{font-size:13.5px;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-inline:2px;min-height:2.7em}
.tile .ttl.none{color:var(--muted);font-style:italic}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.noimg{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:12.5px;background:repeating-linear-gradient(-45deg,var(--surface-2) 0 10px,var(--surface) 10px 20px)}
.noimg svg{width:26px;height:26px;margin:0 auto 8px;display:block;opacity:.7}

.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--text-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--text);font-size:16px}
.empty svg{width:28px;height:28px;color:var(--muted)}

/* ---------- skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 40%,var(--surface) 80%);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- detalhe (modal) ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .25s var(--ease);overflow-y:auto;overscroll-behavior:contain}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(1120px,100%);margin:clamp(0px,3vh,32px) auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow);animation:up .35s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sheet-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px clamp(14px,2.4vw,22px);border-bottom:1px solid var(--line-soft);background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-radius:var(--radius-l) var(--radius-l) 0 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet-head [data-a="close"]{margin-right:auto}
.sheet-head .t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);padding:clamp(16px,3vw,32px)}

/* preview de publicação */
.post{background:#0F0F11;border:1px solid var(--line);border-radius:18px;overflow:hidden;max-width:470px;width:100%;margin:0 auto;align-self:start;position:sticky;top:80px}
.post-head{display:flex;align-items:center;gap:10px;padding:11px 13px}
.avatar{width:34px;height:34px;border-radius:50%;padding:2px;background:conic-gradient(from 210deg,var(--yellow),#9b7616,var(--yellow-hi),var(--yellow));flex:none}
.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#18181b;border:2px solid #0F0F11;font:700 11px var(--f-display);color:var(--yellow)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #0F0F11;display:block}
.post-head b{font-size:13.5px;display:block;line-height:1.2}
.post-head small{color:var(--muted);font-size:11.5px}
.post-media{position:relative;aspect-ratio:4/5;background:var(--surface-2)}
.post-media img{width:100%;height:100%;object-fit:cover;display:block}
.post-media .nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(245,243,236,.9);color:#111;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.post-media .nav svg{width:16px;height:16px}
.post-media .nav.prev{left:10px}.post-media .nav.next{right:10px}
.post-media .count{position:absolute;top:10px;right:10px;font:600 11.5px var(--f-mono);background:rgba(11,11,12,.7);padding:4px 9px;border-radius:999px}
.post-media .reel{position:absolute;top:10px;left:10px;display:inline-flex;gap:6px;align-items:center;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:rgba(11,11,12,.7);padding:5px 9px;border-radius:999px}
.post-media .reel svg{width:13px;height:13px}
.dots{display:flex;gap:5px;justify-content:center;padding-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:#3a3a40;transition:background .2s}
.dots i.on{background:var(--yellow)}
.post-actions{display:flex;align-items:center;gap:16px;padding:10px 14px 4px;color:var(--text)}
.post-actions svg{width:23px;height:23px}
.post-actions .sp{flex:1}
.post-body{padding:6px 14px 16px;font-size:14px;line-height:1.5}
.post-body .likes{font-weight:600;font-size:13.5px;margin-bottom:5px}
.post-body .cap{white-space:pre-wrap;word-wrap:break-word}
.post-body .cap b{margin-right:6px}
.post-body .cap.none{color:var(--muted);font-style:italic}
.post-body .more{background:none;border:0;padding:0;color:var(--muted)}
.post-body .when{margin-top:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* painel lateral */
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.side h2{font-family:var(--f-display);font-size:clamp(20px,2.3vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.side h2.none{color:var(--muted)}
.state-card{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px}
.state-card.em_analise{border-color:rgba(233,190,69,.35);background:linear-gradient(180deg,rgba(233,190,69,.07),var(--surface) 70%)}
.state-card.aprovado{border-color:rgba(114,196,149,.35);background:linear-gradient(180deg,rgba(114,196,149,.07),var(--surface) 70%)}
.state-card.publicado{border-color:rgba(147,184,222,.35);background:linear-gradient(180deg,rgba(147,184,222,.07),var(--surface) 70%)}
.state-card .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.state-card .top .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.state-card .msg{font-size:15px}
.state-card .msg small{display:block;color:var(--text-2);font-size:13px;margin-top:3px}
.state-card .actions{display:flex;gap:10px;flex-wrap:wrap}
.state-card .actions .btn{flex:1 1 180px}
.big-check{display:flex;gap:12px;align-items:flex-start}
.big-check .ok{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--st-aprovado);color:#0b1a11;animation:pop .45s var(--ease)}
.big-check .ok.pub{background:var(--st-publicado);color:#0c1420}
.big-check .ok svg{width:20px;height:20px}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.confirm{border:1px solid var(--yellow-line);border-radius:14px;padding:14px;background:var(--bg-2);display:flex;flex-direction:column;gap:12px;animation:up .25s var(--ease)}
.confirm p{font-size:14px;color:var(--text-2)}
.confirm p b{color:var(--text)}
.success{display:flex;gap:10px;align-items:center;color:var(--st-aprovado);font-size:14px;font-weight:600;animation:up .3s var(--ease)}
.success svg{width:18px;height:18px}
.pending-change{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--danger-bg);border:1px solid rgba(232,131,111,.35);font-size:13.5px;color:#F4C0B4}
.pending-change svg{width:17px;height:17px;flex:none;margin-top:2px}

.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.info > div{padding:14px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:5px;min-width:0}
.info > div:nth-child(odd){padding-right:14px}
.info > div.full{grid-column:1/-1;padding-right:0}
.info dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.info dd{margin:0;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.info dd.big{font-family:var(--f-display);font-size:15px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.info dd.none{color:var(--muted);font-style:italic}

/* comentários */
.thread{display:flex;flex-direction:column;gap:12px}
.thread-head{display:flex;align-items:center;justify-content:space-between}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg-b{max-width:88%;display:flex;flex-direction:column;gap:4px;animation:up .25s var(--ease)}
.msg-b .bub{padding:10px 13px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-soft);font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg-b .by{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg-b .by b{color:var(--text-2);font-weight:600}
.msg-b.client{align-self:flex-end;align-items:flex-end}
.msg-b.client .bub{background:rgba(244,197,66,.09);border-color:rgba(244,197,66,.22);border-bottom-right-radius:5px}
.msg-b.agency .bub{border-bottom-left-radius:5px}
.msg-b.change .bub{border-color:rgba(232,131,111,.45);background:var(--danger-bg)}
.composer{display:flex;flex-direction:column;gap:10px}
.composer .row{justify-content:flex-end}
.muted{color:var(--muted)}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;white-space:nowrap;min-height:40px}
.tab:hover{color:var(--text);background:var(--surface)}
.tab[aria-current="page"]{color:var(--text);background:var(--surface-2)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-title h2{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.section-title .muted{font-size:13px}
.admin-top h1{font-family:var(--f-display);font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:22px}
.kpi{background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:7px;align-items:center}
.kpi .k i{width:7px;height:7px;border-radius:50%}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.note{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;animation:rise .35s var(--ease) both}
.note.unread{border-color:var(--yellow-line);box-shadow:inset 3px 0 0 var(--yellow)}
.note.change.unread{border-color:rgba(232,131,111,.5);box-shadow:inset 3px 0 0 var(--danger)}
.note .h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.note .h b{font-size:14px}
.note dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.note dt{color:var(--muted)}
.note dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.note q{display:block;font-size:14px;color:var(--text);background:var(--bg-2);border-radius:10px;padding:10px 12px;quotes:"“" "”"}
.note .f{display:flex;gap:8px;justify-content:flex-end}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tbl th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface)}
.tbl .n{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.tbl .n.hl{color:var(--danger);font-weight:700}
.cname b{display:block}
.cname small{color:var(--muted);font-size:12px}
.activity{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.act{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line-soft);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;transition:background .15s}
.act:last-child{border-bottom:0}
.act:hover{background:var(--surface)}
.act .i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.act .i svg{width:15px;height:15px}
.act .i.approval{color:var(--st-aprovado);background:var(--st-aprovado-bg)}
.act .i.change_request{color:var(--danger);background:var(--danger-bg)}
.act .i.comment{color:var(--yellow);background:var(--yellow-soft)}
.act .b{flex:1;min-width:0;font-size:13.5px}
.act .b small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.act .b .q{color:var(--text-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.admin-panel{border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg-2)}
.admin-panel h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);min-height:40px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"].em_analise{background:var(--st-analise-bg);color:var(--st-analise)}
.seg button[aria-pressed="true"].aprovado{background:var(--st-aprovado-bg);color:var(--st-aprovado)}
.seg button[aria-pressed="true"].publicado{background:var(--st-publicado-bg);color:var(--st-publicado)}
.history{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.history span{display:flex;gap:8px;align-items:center}
.history i{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}

/* importador */
.imp-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:20px;align-items:start}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:15px;font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--text-2);font-size:13.5px;transition:all .2s;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--bg-2)}
.drop.over{border-color:var(--yellow);background:var(--yellow-soft);color:var(--text)}
.drop svg{width:24px;height:24px;color:var(--muted)}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files span{font-family:var(--f-mono);font-size:11px;padding:4px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pv-list{display:flex;flex-direction:column;gap:10px}
.pv{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);animation:rise .3s var(--ease) both}
.pv.conflict,.pv.ambiguous{border-color:rgba(232,131,111,.45)}
.pv .th{width:84px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--surface-2);position:relative}
.pv .th img{width:100%;height:100%;object-fit:cover;display:block}
.pv .th .noimg{font-size:10px;padding:6px}
.pv .th .noimg svg{width:18px;height:18px;margin-bottom:4px}
.pv .bd{display:flex;flex-direction:column;gap:6px;min-width:0}
.pv .bd b{font-size:14.5px}
.pv .bd .ln{font-size:12.5px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv .bd .cap{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pv .warns{display:flex;gap:6px;flex-wrap:wrap}
.pv .ops{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pv .choice{display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-top:4px;padding:10px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-soft)}
.pv .choice label{display:flex;gap:8px;align-items:center;cursor:pointer}
.act-tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.act-tag.create{background:var(--st-aprovado-bg);color:var(--st-aprovado)}
.act-tag.update{background:var(--yellow-soft);color:var(--yellow)}
.act-tag.same{background:var(--surface-2);color:var(--muted)}
.act-tag.conflict,.act-tag.ambiguous{background:var(--danger-bg);color:var(--danger)}
.codebox{font-family:var(--f-mono);font-size:12px;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;white-space:pre-wrap;color:var(--text-2);max-height:260px;overflow:auto}
.code-pill{font-family:var(--f-mono);letter-spacing:.2em;font-size:13px;padding:5px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line)}
.logo-prev{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);display:flex;align-items:center;justify-content:center;padding:10px 16px}
.logo-prev img{max-height:44px;width:auto}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{pointer-events:auto;background:var(--surface-3);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:14px;display:flex;gap:10px;align-items:center;animation:up .3s var(--ease)}
.toast svg{width:17px;height:17px;flex:none}
.toast.ok svg{color:var(--st-aprovado)}
.toast.err{border-color:rgba(232,131,111,.5)}
.toast.err svg{color:var(--danger)}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}

/* ---------- responsivo ---------- */
@media (max-width:960px){
  .hero{grid-template-columns:1fr}
  .hero-visual{max-width:520px;margin-top:10px}
  .sheet-body{grid-template-columns:1fr}
  .post{position:static}
  .imp-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .feed{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feed-head .hint{display:none}
  .sheet-head .t{display:none}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum:nth-child(3){margin-left:0}
  .sum{margin-top:1px}
  .sum:nth-child(-n+2){margin-top:0}
  .steps{grid-template-columns:1fr}
  .brand-sub{display:none}
  .who{display:none}
  .sheet{margin:0;border-radius:0;border:0;min-height:100%}
  .sheet-head{border-radius:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .pv{grid-template-columns:64px minmax(0,1fr)}
  .pv .th{width:64px}
  .pv .ops{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
  .mock-float{left:8px;bottom:-18px}
  .info{grid-template-columns:1fr}
  .info > div:nth-child(odd){padding-right:0}
  .state-card .actions .btn{flex-basis:100%}
}
@media (max-width:420px){
  .feed{gap:8px}
  .tile .ttl{font-size:12.5px}
  .tile .when{font-size:10.5px}
  .status{font-size:9.5px;padding:4px 8px 4px 7px;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){
